version = 1
SPDX-PackageName = "flutter_ports"
SPDX-PackageSupplier = "Vasiliy Ditsyak <vasilich6107@users.noreply.github.com>"
SPDX-PackageDownloadLocation = "https://github.com/artflutter/flutter_ports"

# When several annotations match a path, the last one wins, so each table lists
# every holder for its paths. third_party/Chart.js, third_party/kurkle-color
# and third_party/chartjs-test-utils are git submodules and are not part of
# this tree. The 34 D3 directories are git submodules too: third_party/d3, the
# 30 third_party/d3-* modules, third_party/internmap, third_party/delaunator and
# third_party/robust-predicates. third_party/echarts, third_party/zrender,
# third_party/chartjs-plugin-zoom and third_party/chartjs-chart-sankey are git
# submodules too.
# packages/flutter_kurkle_color_port ports third_party/kurkle-color.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vasiliy Ditsyak"
SPDX-License-Identifier = "MIT"

# The Chart.js port, and the gallery code where ported Chart.js samples live:
# derived from Chart.js (MIT), so the upstream notice is kept alongside ours.
[[annotations]]
path = ["packages/flutter_chartjs_port/**", "apps/chartjs_gallery/lib/**", "apps/chartjs_gallery/test/**", "apps/chartjs_docs/lib/**", "apps/chartjs_docs/test/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2014-2024 Chart.js Contributors", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The test harness: a port of chartjs-test-utils 0.4.0 (MIT), so its notice is
# kept alongside ours (porting-flow.md section 3).
[[annotations]]
path = "packages/chartjs_test_utils/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2020 chartjs-test-utils Contributors", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The D3 port: Dart ports of D3 7.9.0 and its module repositories (ISC). This
# table keeps the upstream notice with ours (D3 ADR 0001). The code of the
# port is ISC too. The change that ports a D3 module with another license or
# holder adds a table for that module after this table.
[[annotations]]
path = "packages/flutter_d3_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2010-2026 Mike Bostock", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "ISC"

# The ECharts port: Dart ports of Apache ECharts 6.1.0 (Apache-2.0). This table
# keeps the upstream notice with ours (ECharts ADR 0001). The code of the port
# is Apache-2.0 too. The package NOTICE keeps the Apache ECharts NOTICE. The
# change that ports the first file of another component adds a table for its
# files after this table (ECharts ADR 0001 item 12): zrender (BSD-3-Clause,
# Baidu Inc.), the five ECharts files with d3 code (BSD-3-Clause), and the
# zrender files with node-timsort, jsdiff and tween.js code.
[[annotations]]
path = "packages/flutter_echarts_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2017-2026 The Apache Software Foundation", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "Apache-2.0"

# The chartjs-plugin-zoom port: Dart ports of chartjs-plugin-zoom 2.2.0+fb81d331
# (MIT). This table keeps the upstream notice with ours (Zoom ADR 0001). The
# package ports no Chart.js code. It imports the public libraries of
# flutter_chartjs_port (ADR 0009).
[[annotations]]
path = "packages/flutter_chartjs_plugin_zoom_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2013-2024 chartjs-plugin-zoom contributors", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The chartjs-chart-sankey port: Dart ports of chartjs-chart-sankey 0.19.1
# (MIT). This table keeps the upstream notice with ours (Sankey ADR 0001). The
# package ports no Chart.js code. It imports the public libraries of
# flutter_chartjs_port (ADR 0009).
[[annotations]]
path = "packages/flutter_chartjs_chart_sankey_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2019-2026 Jukka Kurkela", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The @kurkle/color port: Dart ports of @kurkle/color 0.3.2 (MIT) and of its
# test/index.js. This table keeps the upstream notice with ours. The package
# ports no Chart.js code.
[[annotations]]
path = "packages/flutter_kurkle_color_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2018-2021 Jukka Kurkela", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# Icons generated by `flutter create` from Flutter's app template.
[[annotations]]
path = [
  "apps/chartjs_gallery/web/favicon.png",
  "apps/chartjs_docs/web/favicon.png",
  "apps/chartjs_docs/web/icons/**",
  "apps/chartjs_gallery/web/icons/**",
  "apps/chartjs_gallery/macos/Runner/Assets.xcassets/AppIcon.appiconset/*.png",
  "apps/chartjs_gallery/ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png",
  "apps/chartjs_gallery/ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png",
  "apps/chartjs_gallery/android/app/src/main/res/mipmap-*/ic_launcher.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 The Flutter Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# The test font of the harness: the unchanged Liberation Sans files and LICENSE
# of liberation-fonts-ttf-2.1.5 (SIL OFL 1.1, Chart.js ADR 0015). They are not
# derived from chartjs-test-utils, so this table replaces the harness table
# above for these files.
[[annotations]]
path = "packages/chartjs_test_utils/lib/fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2010 Google Corporation", "2012 Red Hat, Inc."]
SPDX-License-Identifier = "OFL-1.1"


# External logo reference images used only in the local comparison catalog.
# Per-image attribution and original URLs are in the adjacent sources.json and
# logo-options/_research/references.json. These are not MIT project artwork.
[[annotations]]
path = [
  "apps/chartjs_gallery/design/logo-options/_research/assets/**",
  "apps/chartjs_gallery/design/logo-options/**/references/*.png",
  "apps/chartjs_gallery/design/logo-options/**/references/*.jpg",
  "apps/chartjs_gallery/design/logo-options/**/references/*.webp",
  "apps/chartjs_gallery/design/logo-options/**/references/*.gif",
]
precedence = "override"
SPDX-FileCopyrightText = "External rights holders; see the adjacent sources.json"
SPDX-License-Identifier = "LicenseRef-External-Logo-Reference"

# Earlier generated concept boards copied beside their refinements are ours.
[[annotations]]
path = "apps/chartjs_gallery/design/logo-options/**/references/input-*.png"
precedence = "override"
SPDX-FileCopyrightText = "2026 Vasiliy Ditsyak"
SPDX-License-Identifier = "MIT"

# The code font of the docs site. The font file stays unchanged.
[[annotations]]
path = "apps/chartjs_docs/assets/fonts/RobotoMono-Regular.ttf"
precedence = "override"
SPDX-FileCopyrightText = "2015 Google Inc."
SPDX-License-Identifier = "Apache-2.0"

# The data of the fl_chart line samples 12 and 13 of the docs site: files of
# the fl_chart example app (MIT), unchanged.
[[annotations]]
path = "apps/chartjs_docs/assets/flchart/**"
precedence = "override"
SPDX-FileCopyrightText = "2022 Flutter 4 Fun"
SPDX-License-Identifier = "MIT"

# The data of the Graphic demos of the docs site: a trimmed copy of the data of
# the Graphic example app (MIT).
[[annotations]]
path = "apps/chartjs_docs/lib/migrate/graphic/graphic_data.dart"
precedence = "override"
SPDX-FileCopyrightText = ["2024 LIN Chen", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The samples of the docs of chartjs-plugin-zoom in the gallery: Dart ports of
# docs/samples and docs/scripts/defaults.js of chartjs-plugin-zoom
# 2.2.0+fb81d331 (MIT), so the upstream notice is kept alongside ours. They
# port no Chart.js code.
[[annotations]]
path = "apps/chartjs_gallery/lib/docs/zoom/**"
precedence = "override"
SPDX-FileCopyrightText = ["2013-2024 chartjs-plugin-zoom contributors", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The samples of the docs of chartjs-chart-sankey in the gallery: Dart ports of
# src/content/docs/samples and docs/scripts/utils.js of chartjs-chart-sankey
# 0.19.1 (MIT), so the upstream notice is kept alongside ours. They port no
# Chart.js code.
[[annotations]]
path = "apps/chartjs_gallery/lib/docs/sankey/**"
precedence = "override"
SPDX-FileCopyrightText = ["2019-2026 Jukka Kurkela", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

version = 1
SPDX-PackageName = "flutter_ports"
SPDX-PackageSupplier = "Vasiliy Ditsyak <vasilich6107@users.noreply.github.com>"
SPDX-PackageDownloadLocation = "https://github.com/artflutter/flutter_ports"

# When several annotations match a path, the last one wins, so each table lists
# every holder for its paths. third_party/Chart.js, third_party/kurkle-color
# and third_party/chartjs-test-utils are git submodules and are not part of
# this tree. The 34 D3 directories are git submodules too: third_party/d3, the
# 30 third_party/d3-* modules, third_party/internmap, third_party/delaunator and
# third_party/robust-predicates. third_party/echarts and third_party/zrender are
# git submodules too. third_party/fdlibm is a committed copy and has its own
# table below.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Vasiliy Ditsyak"
SPDX-License-Identifier = "MIT"

# The Chart.js port, and the gallery code where ported Chart.js samples live:
# derived from Chart.js (MIT), so the upstream notice is kept alongside ours.
[[annotations]]
path = ["packages/flutter_chartjs/**", "apps/chartjs_gallery/lib/**", "apps/chartjs_gallery/test/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2014-2024 Chart.js Contributors", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The test harness: a port of chartjs-test-utils 0.4.0 (MIT), so its notice is
# kept alongside ours (porting-flow.md section 3).
[[annotations]]
path = "packages/chartjs_test_utils/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2020 chartjs-test-utils Contributors", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The D3 port: Dart ports of D3 7.9.0 and its module repositories (ISC). This
# table keeps the upstream notice with ours (D3 ADR 0001). The code of the
# port is ISC too. The change that ports a D3 module with another license or
# holder adds a table for that module after this table.
[[annotations]]
path = "packages/flutter_d3_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2010-2026 Mike Bostock", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "ISC"

# The ECharts port: Dart ports of Apache ECharts 6.1.0 (Apache-2.0). This table
# keeps the upstream notice with ours (ECharts ADR 0001). The code of the port
# is Apache-2.0 too. The package NOTICE keeps the Apache ECharts NOTICE. The
# change that ports the first file of another component adds a table for its
# files after this table (ECharts ADR 0001 item 12): zrender (BSD-3-Clause,
# Baidu Inc.), the five ECharts files with d3 code (BSD-3-Clause), and the
# zrender files with node-timsort, jsdiff and tween.js code.
[[annotations]]
path = "packages/flutter_echarts_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2017-2026 The Apache Software Foundation", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "Apache-2.0"

# Icons generated by `flutter create` from Flutter's app template.
[[annotations]]
path = [
  "apps/chartjs_gallery/web/favicon.png",
  "apps/chartjs_gallery/web/icons/**",
  "apps/chartjs_gallery/macos/Runner/Assets.xcassets/AppIcon.appiconset/*.png",
  "apps/chartjs_gallery/ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png",
  "apps/chartjs_gallery/ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png",
  "apps/chartjs_gallery/android/app/src/main/res/mipmap-*/ic_launcher.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 The Flutter Authors"
SPDX-License-Identifier = "BSD-3-Clause"

# fdlibm 5.3 e_log.c, e_log10.c, s_atan.c, e_atan2.c, s_sin.c, s_cos.c, k_sin.c, k_cos.c,
# e_rem_pio2.c, k_rem_pio2.c and s_scalbn.c from netlib, kept unchanged as the reference for
# the lib/src/js/fdlibm_*.dart ports (Chart.js ADRs 0032 and 0035). They carry a 1993 notice.
[[annotations]]
path = "third_party/fdlibm/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "1993 Sun Microsystems, Inc."
SPDX-License-Identifier = "SunPro"

# The Dart ports of fdlibm. They are not derived from Chart.js, so this table
# replaces the package table above for these files.
[[annotations]]
path = [
  "packages/flutter_chartjs/lib/src/js/fdlibm_log.dart",
  "packages/flutter_chartjs/lib/src/js/fdlibm_atan.dart",
  "packages/flutter_chartjs/lib/src/js/fdlibm_trig.dart",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["1993 Sun Microsystems, Inc.", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "SunPro AND MIT"

# The Dart port of @kurkle/color 0.3.2 (MIT) and of its test/index.js. They
# are not derived from Chart.js, so this table replaces the package table
# above for these files.
[[annotations]]
path = [
  "packages/flutter_chartjs/lib/src/kurkle_color/**",
  "packages/flutter_chartjs/test/kurkle_color/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2018-2021 Jukka Kurkela", "2026 Vasiliy Ditsyak"]
SPDX-License-Identifier = "MIT"

# The test font of the harness: the unchanged Liberation Sans files and LICENSE
# of liberation-fonts-ttf-2.1.5 (SIL OFL 1.1, Chart.js ADR 0015). They are not
# derived from chartjs-test-utils, so this table replaces the harness table
# above for these files.
[[annotations]]
path = "packages/chartjs_test_utils/lib/fonts/**"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2010 Google Corporation", "2012 Red Hat, Inc."]
SPDX-License-Identifier = "OFL-1.1"

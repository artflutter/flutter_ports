version = 1
SPDX-PackageName = "flutter_ports"
SPDX-PackageDownloadLocation = "https://github.com/artflutter/flutter_ports"

# When several annotations match a path, the last one wins, so each table lists
# every holder for its paths. third_party/Chart.js, third_party/kurkle-color
# and third_party/chartjs-test-utils are git submodules and are not part of
# this tree. The 34 D3 directories are git submodules too: third_party/d3, the
# 30 third_party/d3-* modules, third_party/internmap, third_party/delaunator and
# third_party/robust-predicates. third_party/echarts, third_party/zrender,
# third_party/chartjs-plugin-zoom and third_party/chartjs-chart-sankey are git
# submodules too.
# packages/flutter_kurkle_color_port ports third_party/kurkle-color.
# packages/flutter_d3_color_port ports third_party/d3-color.
# packages/flutter_d3_interpolate_port ports third_party/d3-interpolate.
# packages/flutter_d3_scale_chromatic_port ports third_party/d3-scale-chromatic.
# packages/flutter_d3_path_port ports third_party/d3-path.
# packages/flutter_d3_shape_port ports third_party/d3-shape.
# packages/flutter_d3_format_port ports third_party/d3-format.
# packages/flutter_d3_array_port ports third_party/d3-array.
# packages/flutter_d3_contour_port ports third_party/d3-contour.
# packages/flutter_d3_quadtree_port ports third_party/d3-quadtree.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "MIT"

# The Chart.js port, and the gallery code where ported Chart.js samples live:
# derived from Chart.js (MIT), so the upstream notice is kept.
[[annotations]]
path = ["packages/flutter_chartjs_port/**", "apps/chartjs_gallery/lib/**", "apps/chartjs_gallery/test/**", "apps/chartjs_docs/lib/**", "apps/chartjs_docs/test/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014-2024 Chart.js Contributors"
SPDX-License-Identifier = "MIT"

# The test harness: a port of chartjs-test-utils 0.4.0 (MIT), so its notice is
# kept (porting-flow.md section 3).
[[annotations]]
path = "packages/chartjs_test_utils/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2020 chartjs-test-utils Contributors"
SPDX-License-Identifier = "MIT"

# The D3 port: Dart ports of D3 7.9.0 and its module repositories (ISC). This
# table keeps the upstream notice (D3 ADR 0001). The code of the port is ISC
# too. The change that ports a D3 module with another license or holder adds a
# table for that module after this table.
[[annotations]]
path = "packages/flutter_d3_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2010-2026 Mike Bostock"
SPDX-License-Identifier = "ISC"

# The ECharts port: Dart ports of Apache ECharts 6.1.0 (Apache-2.0). This table
# keeps the upstream notice (ECharts ADR 0001). The code of the port is
# Apache-2.0 too. The package NOTICE keeps the Apache ECharts NOTICE. The change
# that ports the first file of another component adds a table for its files
# after this table (ECharts ADR 0001 item 12): zrender (BSD-3-Clause, Baidu
# Inc.), the five ECharts files with d3 code (BSD-3-Clause), and the zrender
# files with node-timsort, jsdiff and tween.js code.
[[annotations]]
path = "packages/flutter_echarts_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2017-2026 The Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

# The chartjs-plugin-zoom port: Dart ports of chartjs-plugin-zoom 2.2.0+fb81d331
# (MIT). This table keeps the upstream notice (Zoom ADR 0001). The package ports
# no Chart.js code. It imports the public libraries of flutter_chartjs_port
# (ADR 0009).
[[annotations]]
path = "packages/flutter_chartjs_plugin_zoom_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2013-2024 chartjs-plugin-zoom contributors"
SPDX-License-Identifier = "MIT"

# The chartjs-chart-sankey port: Dart ports of chartjs-chart-sankey 0.19.1
# (MIT). This table keeps the upstream notice (Sankey ADR 0001). The package
# ports no Chart.js code. It imports the public libraries of
# flutter_chartjs_port (ADR 0009).
[[annotations]]
path = "packages/flutter_chartjs_chart_sankey_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-2026 Jukka Kurkela"
SPDX-License-Identifier = "MIT"

# The @kurkle/color port: Dart ports of @kurkle/color 0.3.2 (MIT) and of its
# test/index.js. This table keeps the upstream notice. The package ports no
# Chart.js code.
[[annotations]]
path = "packages/flutter_kurkle_color_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2018-2021 Jukka Kurkela"
SPDX-License-Identifier = "MIT"

# The d3-color port: Dart ports of d3-color 3.1.0 (ISC), the D3 color module
# as a package of its own, as on npm (D3 ADR 0008). This table keeps the
# upstream notice. The code of the port is ISC too.
[[annotations]]
path = "packages/flutter_d3_color_port/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2010-2022 Mike Bostock"
SPDX-License-Identifier = "ISC"


name: flutter_chartjs
description: >-
  A native Dart port of Chart.js for Flutter. Charts are drawn with Flutter's
  own canvas, with no WebView and no JavaScript. Work in progress.
version: 0.0.1
# Remove at the first release.
publish_to: none
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_chartjs
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - chart
  - chartjs
  - graph
  - visualization
  - canvas

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  # jsDateNow reads clock.now(), the clock that the FakeAsync zone of
  # testWidgets moves (Chart.js ADR 0010 section 6). 1.1.2 is the version that
  # fake_async already resolves in the workspace.
  clock: ^1.1.2
  # jsSort calls mergeSort, a stable sort (Chart.js ADR 0010). 1.19.1 is the
  # pin of Flutter 3.44.9.
  collection: ^1.19.1
  flutter:
    sdk: flutter
  # Numbers (js_intl.dart, Chart.js ADR 0026) and the date adapter
  # (porting-flow.md 2.10) format through intl. 0.20.2 is the pin of
  # flutter_localizations in Flutter 3.44.9.
  intl: ^0.20.2
  # @internal on underscore members that other modules read (Chart.js ADR
  # 0004).
  meta: ^1.18.0

dev_dependencies:
  # tool/check_js_semantics.dart resolves the types of interpolated values.
  # 12.1.0 is the version that test_core already resolves in the workspace.
  analyzer: ^12.1.0
  # The test harness (porting-flow.md section 3). It depends on this package;
  # the workspace resolves the cycle.
  chartjs_test_utils: ^0.0.1
  flutter_test:
    sdk: flutter
  # Pure-layer specs and port tests run with `dart test` on the VM, dart2js and
  # dart2wasm (porting-flow.md section 3). 1.31.0 matches the test_api pin of
  # flutter_test in Flutter 3.44.9.
  test: ^1.31.0

name: flutter_d3_hierarchy_port
description: >-
  A native, fully statically typed Dart port of d3-hierarchy 3.1.2: hierarchy,
  stratify, cluster, tree, treemap (all 6 tiling algorithms), partition, pack,
  packSiblings, and packEnclose.
version: 0.1.0
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_d3_hierarchy_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - d3
  - hierarchy
  - treemap
  - tree
  - visualization

environment:
  sdk: ^3.13.0

resolution: workspace

dev_dependencies:
  test: ^1.32.0
  very_good_analysis: ^11.0.0

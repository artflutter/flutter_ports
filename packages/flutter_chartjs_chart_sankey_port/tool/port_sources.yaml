# The projects that packages/flutter_chartjs_chart_sankey_port ports code from
# (Sankey ADR 0001). Each "// Ported from" header must name a project of this
# file, with the same license and holder. The only entry is
# chartjs-chart-sankey. The package ports no Chart.js code: it imports the
# public libraries of packages/flutter_chartjs_port (ADR 0009).
#
# packages/flutter_chartjs_chart_sankey_port/test/upstream_test.dart and
# tool/check_upstream_pin.sh read this file. Both compare the gitlink with
# "commit". The script also reads the commit of the tag "ref" with
# git ls-remote. Both fail on a submodule of .gitmodules that no entry of a
# packages/*/tool/port_sources.yaml file pins. Both skip the top-level keys
# other than "sources".
#
# The port checks of packages/flutter_chartjs_port/tool read this file too
# (ADR 0009 item 6): check:headers with this package as its first package,
# check:lib-imports and check:js-semantics with this package after the host.
#
# Top-level keys before "sources":
# - marker: the tag of the DIVERGES markers, "// DIVERGES(sankey): <row id>,
#   <reason>" (Sankey ADR 0002). The default is "chartjs".
# - host: the host package of the add-on port (ADR 0009). check:lib-imports
#   allows the imports of the public libraries of the host, the libraries
#   directly in its lib/, and rejects package:<host>/src/.
#
# The keys of an entry are those of
# packages/flutter_chartjs_plugin_zoom_port/tool/port_sources.yaml. The pin
# is a release pin: "version" is "v<chartjsChartSankeyVersion>", and "ref" is
# the tag. A unit test src/**/*.test.ts has a file target, which applies
# before the directory target of src/. The entry has no "files" key. Thus
# check:headers reads the source paths from the checked-out submodule
# (dart run melos run upstream).
#
# All paths are relative to the repository root. Only "source" is relative
# to the project root.

marker: sankey
host: flutter_chartjs_port

sources:
  - header: chartjs-chart-sankey
    version: "v0.19.1"
    version_source: chartjsChartSankeyVersion in packages/flutter_chartjs_chart_sankey_port/lib/src/upstream.dart
    url: https://github.com/kurkle/chartjs-chart-sankey
    language: js
    spdx: MIT
    holder: Jukka Kurkela
    pin:
      kind: submodule
      path: third_party/chartjs-chart-sankey
      ref: "v0.19.1"
      commit: 90b638b11b9cdc5735b72f1b93022120e67a5eb7
    targets:
      - source: src/flow.test.ts
        dart: packages/flutter_chartjs_chart_sankey_port/test/specs/flow_test.dart
      - source: src/labels.test.ts
        dart: packages/flutter_chartjs_chart_sankey_port/test/specs/labels_test.dart
      - source: src/lib/core.test.ts
        dart: packages/flutter_chartjs_chart_sankey_port/test/specs/lib/core_test.dart
      - source: src/lib/helpers.test.ts
        dart: packages/flutter_chartjs_chart_sankey_port/test/specs/lib/helpers_test.dart
      - source: src/lib/layout.test.ts
        dart: packages/flutter_chartjs_chart_sankey_port/test/specs/lib/layout_test.dart
      - source: src/
        dart: packages/flutter_chartjs_chart_sankey_port/lib/src/
      - source: test/specs/
        dart: packages/flutter_chartjs_chart_sankey_port/test/specs/
      - source: test/fixtures/
        dart: packages/flutter_chartjs_chart_sankey_port/test/fixtures/hand/
      - source: test/setup.js
        dart: packages/flutter_chartjs_chart_sankey_port/test/flutter_test_config.dart

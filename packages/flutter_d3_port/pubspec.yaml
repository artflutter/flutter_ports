name: flutter_d3_port
description: >-
  A native Dart port of D3 for Flutter. The D3 modules run as Dart code, with
  no WebView and no JavaScript. Work in progress.
version: 0.0.1
# Remove at the first release.
publish_to: none
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_d3_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - d3
  - chart
  - visualization
  - graph
  - canvas

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # The tests use package:test. The constraint is the test constraint of
  # flutter_chartjs. 1.31.1 matches the test_api pin of flutter_test in
  # Flutter 3.47.7 (0.7.12).
  test: ^1.31.1

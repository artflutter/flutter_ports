name: flutter_d3_port
description: >-
  A native Dart port of D3 for Flutter. The D3 modules run as Dart code, with
  no WebView and no JavaScript. Work in progress.
version: 0.0.2
# Remove at the first release.
publish_to: none
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_d3_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - d3
  - chart
  - visualization
  - graph
  - canvas

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The D3 modules, one package each, as on npm (D3 ADR 0008). The bundle
  # index re-exports each of them.
  flutter_d3_array_port: ^0.1.0
  flutter_d3_color_port: ^0.3.0
  flutter_d3_contour_port: ^0.1.0
  flutter_d3_format_port: ^0.1.0
  flutter_d3_hierarchy_port: ^0.1.0
  flutter_d3_interpolate_port: ^0.3.0
  flutter_d3_path_port: ^0.1.0
  flutter_d3_quadtree_port: ^0.1.0
  flutter_d3_scale_chromatic_port: ^0.3.0
  flutter_d3_shape_port: ^0.1.0

dev_dependencies:
  # The tests use package:test. The constraint is the test constraint of
  # flutter_chartjs_port. 1.31.1 matches the test_api pin of flutter_test in
  # Flutter 3.47.7 (0.7.12).
  test: ^1.32.0

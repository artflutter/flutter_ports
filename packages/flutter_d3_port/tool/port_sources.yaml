# The projects that packages/flutter_d3_port ports code from (D3 ADR 0001).
# Each "// Ported from" header must name a project of this file, with the
# same license and holder. The first entry is the d3 bundle, the upstream
# repository of ADR 0005. The other 33 entries are the D3 module
# repositories and the three repositories outside the d3 organization. They
# are the "other projects" of the port, as in Chart.js ADR 0011.
#
# The pin rule (D3 ADR 0001): each repository is at the newest release tag
# in the semver ranges of the d3 v7.9.0 package.json. A range of a module
# package.json applies to the repositories that d3 does not list.
#
# packages/flutter_d3_port/test/upstream_test.dart and
# tool/check_upstream_pin.sh read this file. The test compares each gitlink
# with "commit". The script compares each gitlink with the upstream commit of
# "ref" (git ls-remote). Both also fail on a submodule of .gitmodules that no
# entry of this file or of packages/flutter_chartjs/tool/port_sources.yaml
# pins.
#
# Keys of an entry, as in packages/flutter_chartjs/tool/port_sources.yaml:
# - header: the project name in the header.
# - version: the header version. It is equal to the pin ref.
# - version_source: where the version comes from.
# - url: the project repository.
# - language: the language of the source. "js" is JavaScript.
# - spdx: the SPDX license identifier of the repository LICENSE.
# - holder: the copyright holder, as the header, the package LICENSE and
#   REUSE.toml write it. It is the first copyright line of the repository
#   LICENSE without the year. The robust-predicates LICENSE has no copyright
#   line. Its holder is the author of its package.json.
# - pin: the reference copy in this repository. kind "submodule" is a git
#   submodule at the commit "commit" (tag "ref"). For an annotated tag,
#   "commit" is the tagged commit, not the tag object.
# - targets: the Dart path of a source path (D3 ADR 0002). A "source" that
#   ends with "/" is a directory. Its files map into the "dart" directory.
#   The map changes "-test.js" to "_test.dart" and ".js" to ".dart". Any
#   other "source" is one file. Its "dart" is the Dart file. A file target
#   applies before a directory target. Four test entries do not end with
#   "-test.js". They have file targets (D3 ADR 0002 section 1).
# - files, file_index: the source paths that exist at the pin. Phase 0 ports
#   no file. Thus no entry has these keys yet.
#
# All paths are relative to the repository root. Only "source" is relative
# to the project root.

sources:
  - header: d3
    version: "v7.9.0"
    version_source: d3Version in packages/flutter_d3_port/lib/src/upstream.dart
    url: https://github.com/d3/d3
    language: js
    spdx: ISC
    holder: Mike Bostock
    pin:
      kind: submodule
      path: third_party/d3
      ref: "v7.9.0"
      commit: 1f8dd3b92960f58726006532c11e9457864513ec
    targets:
      - source: src/
        dart: packages/flutter_d3_port/lib/src/d3/
      - source: test/
        dart: packages/flutter_d3_port/test/specs/d3/


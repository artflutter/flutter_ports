name: flutter_d3_contour_port
description: >-
  A native, fully statically typed pure-Dart port of d3-contour 4.0.2:
  marching-squares contour polygons (contours, Contours, ContourMultiPolygon)
  and 2D kernel density estimation (contourDensity, ContourDensity<T>).
version: 0.1.0
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_d3_contour_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - d3
  - contour
  - isoline
  - density
  - visualization

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter_d3_array_port: ^0.1.1

dev_dependencies:
  test: ^1.32.0
  very_good_analysis: ^11.0.0

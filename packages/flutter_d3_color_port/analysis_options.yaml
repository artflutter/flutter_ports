# The rules of the root analysis_options.yaml. pana formats the package with
# the formatter setting of very_good_analysis only through this file.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/build/**"
    - build/**

linter:
  rules:
    use_primary_constructors: true
    # Upstream d3-color 3.1.0 keeps the deprecated color.hex(), so the port
    # keeps Color.hex() in each version. An ignore comment on it fails pana
    # with unnecessary_ignore in a version where the lint does not fire.
    remove_deprecations_in_breaking_versions: false

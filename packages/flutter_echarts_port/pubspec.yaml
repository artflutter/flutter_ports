name: flutter_echarts_port
description: >-
  A native Dart port of Apache ECharts and its renderer zrender for Flutter.
  The ECharts modules run as Dart code, with no WebView and no JavaScript.
  Work in progress.
version: 0.0.1
# Remove at the first release.
publish_to: none
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_echarts_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - echarts
  - chart
  - visualization
  - graph
  - canvas

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  # The tests use package:test. The constraint is the test constraint of
  # flutter_chartjs. 1.31.0 matches the test_api pin of flutter_test in
  # Flutter 3.44.9.
  test: ^1.31.0

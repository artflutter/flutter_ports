name: flutter_d3_time_port
description: >-
  A native, fully statically typed pure-Dart port of d3-time 3.1.0: DST-aware
  local and UTC calendar intervals (millisecond through year, weekdays,
  unixDay), CountableTimeInterval, and nice timeTicks/utcTicks generation.
version: 0.1.0
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_d3_time_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - d3
  - time
  - calendar
  - datetime
  - visualization

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter_d3_array_port: ^0.1.1

dev_dependencies:
  test: ^1.32.0
  very_good_analysis: ^11.0.0

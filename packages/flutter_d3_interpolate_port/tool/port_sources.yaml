# The projects that packages/flutter_d3_interpolate_port ports code from (D3
# ADR 0008). Each "// Ported from" header must name a project of this file,
# with the same license and holder. The only entry is d3-interpolate. The
# package depends on flutter_d3_color_port, the port of d3-color, as the npm
# package d3-interpolate depends on d3-color. flutter_d3_port depends on it.
#
# tool/check_upstream_pin.sh and the test/upstream_test.dart of this package
# and of flutter_d3_port read this file. The pin readers skip the top-level
# keys other than "sources".
#
# The header check of packages/flutter_chartjs_port/tool reads this file
# (check:headers with this package as its home package).
#
# Top-level keys before "sources":
# - marker: the tag of the DIVERGES markers, "// DIVERGES(d3-interpolate):
#   <row id>, <reason>". The rows are in doc/differences.md.
#
# The keys of an entry are those of packages/flutter_d3_port/tool/
# port_sources.yaml. The pin is a release pin: "version" is
# "v<d3InterpolateVersion>", and "ref" is the tag. "files" lists the ported
# source paths at the pin, so the header check needs no checkout of the
# submodule.
#
# All paths are relative to the repository root, except "source" and
# "files", which are relative to the project root.

marker: d3-interpolate

sources:
  - header: d3-interpolate
    version: "v3.0.1"
    version_source: d3InterpolateVersion in packages/flutter_d3_interpolate_port/lib/src/upstream.dart
    url: https://github.com/d3/d3-interpolate
    language: js
    spdx: ISC
    holder: Mike Bostock
    pin:
      kind: submodule
      path: third_party/d3-interpolate
      ref: "v3.0.1"
      commit: 6562b85040f7a9b96efe49b54a77eb6fceafa1c1
    targets:
      - source: src/
        dart: packages/flutter_d3_interpolate_port/lib/src/
      - source: test/
        dart: packages/flutter_d3_interpolate_port/test/
    files:
      - src/array.js
      - src/basis.js
      - src/basisClosed.js
      - src/color.js
      - src/constant.js
      - src/cubehelix.js
      - src/date.js
      - src/discrete.js
      - src/hcl.js
      - src/hsl.js
      - src/hue.js
      - src/index.js
      - src/lab.js
      - src/number.js
      - src/numberArray.js
      - src/object.js
      - src/piecewise.js
      - src/quantize.js
      - src/rgb.js
      - src/round.js
      - src/string.js
      - src/transform/decompose.js
      - src/transform/index.js
      - src/transform/parse.js
      - src/value.js
      - src/zoom.js
      - test/array-test.js
      - test/asserts.js
      - test/cubehelix-test.js
      - test/cubehelixLong-test.js
      - test/date-test.js
      - test/discrete-test.js
      - test/hcl-test.js
      - test/hclLong-test.js
      - test/hsl-test.js
      - test/hslLong-test.js
      - test/hue-test.js
      - test/lab-test.js
      - test/number-test.js
      - test/numberArray-test.js
      - test/object-test.js
      - test/piecewise-test.js
      - test/quantize-test.js
      - test/rgb-test.js

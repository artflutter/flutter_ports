      polarArea: scope ChartOptions
      radar: scope ChartOptions
  ScaleOptionsById:
    doc: Port-only kind for index.d.ts:3837 ScaleChartOptions `scales`, the scope `scales` (by scale id in the options and the overrides, by scale type in Chart.defaults.scales).
    others: scope ScaleOptions
    keys: none
  AnimationsSpec:
    doc: index.d.ts:1766 AnimationsSpec, the scope `animations` (by animation name). An entry can be `false`.
    others: bool | scope AnimationOptions
    keys:
      colors: bool | scope AnimationOptions  # core.animations.defaults.js:22
      numbers: bool | scope AnimationOptions
      visible: bool | scope AnimationOptions  # core.animations.defaults.js:53 and :64, the transitions show and hide
      opacity: bool | scope AnimationOptions  # plugin.tooltip.js:1319 defaults
  TransitionsSpec:
    doc: index.d.ts:1793 TransitionsSpec, the scope `transitions` (by update mode).
    others: scope TransitionOptions
    keys:
      active: scope TransitionOptions  # core.animations.defaults.js:37
      resize: scope TransitionOptions
      show: scope TransitionOptions
      hide: scope TransitionOptions
      reset: scope TransitionOptions  # the update mode of core.datasetController.js:346
  TransitionOptions:
    doc: Port-only name for index.d.ts:1788 TransitionSpec, the options of one transition mode.
    keys:
      animation: bool | scope AnimationOptions
      animations: bool | scope AnimationsSpec
  AnimationOptions:
    doc: Port-only name over index.d.ts:1741 AnimationSpec, the entry keys of index.d.ts:1766 AnimationsSpec, the callbacks of index.d.ts:1797 AnimationOptions `animation` and index.d.ts:293 DoughnutAnimationOptions, the scope `animation` and each entry of `animations`.
    keys:

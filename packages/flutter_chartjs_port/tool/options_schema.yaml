# Original code, not ported from Chart.js: the option schema of the typed internal model.
#
# The hand-written schema of Chart.js ADR 0054 section 2. tool/options_gen.dart reads it and
# writes one typed scope class for each kind (`<Kind>Scope`), the `enum OptionKey` of all the
# distinct key names and the `enum ScopeKind`. The reader is tool/src/mini_yaml.dart: block
# mappings, `#` comments and one-line plain scalars. Every scalar is a string.
#
# Each kind under `kinds` has:
# - `doc`: the index.d.ts interface (or the upstream source) and what the scope holds.
# - `element`: only for the element kinds, the element type id (`point`, `line`, `bar`, `arc`,
#   or `generic` for GenericElementOptions).
# - `others`: optional, the shape of a key that `keys` does not list (a dictionary, for example
#   the scale ids under `scales`). Without `others`, an unknown key keeps any value (an extra).
# - `resolved`: only for the four element kinds: the known keys of the resolved options class
#   (`resolved.g.dart`, Chart.js ADR 0054 §9) in the key order of Chart.js ADR 0018 §3: `$shared`,
#   the keys of the element defaults, the keys of its defaultRoutes, `$animations`.
# - `implements`: an interface of the resolved options class (`DrawPointOptions`).
# - `keys`: each JS property name with its shape, or the scalar `none`. The order is the
#   index.d.ts declaration order, the interfaces of an `extends` chain base first, then the hover
#   interfaces, then the keys that upstream code reads and index.d.ts misses (with the reading
#   line in a comment).
#
# A shape is one atom or several atoms joined by ` | `: `number`, `bool`, `string`, `fn` (a
# plain function value), `list` (a plain array value), `any` (any JS value: a color, a point
# style, an object that is not an option scope) or `scope <Kind>` (a nested option object of
# that kind). A shape describes the plain value only: a function (a scriptable option), an
# array (an indexable option), `undefined` and `null` are allowed for every key.
#
# To add a key: add it here at its index.d.ts position, then run `dart run melos run options:gen`
# and commit the generated files of lib/src/options/.
kinds:
  # ---------------------------------------------------------------------------------------------
  # The chart level.
  # ---------------------------------------------------------------------------------------------
  ChartConfiguration:
    doc: Port-only kind for index.d.ts:3914 ChartConfiguration, the raw root config of a chart.
    keys:
      type: string
      data: scope ChartData
      options: scope ChartOptions
      plugins: list
      platform: any
      $theme: any  # the compiled theme of Chart.js ADR 0050, read at core.config.dart chartThemeOf
  ChartData:
    doc: index.d.ts:3892 ChartData, the `data` object of the config.
    keys:
      labels: list
      xLabels: list
      yLabels: list
      datasets: list
  ChartOptions:
    doc: index.d.ts:3843 ChartOptions (index.d.ts:1629 CoreChartOptions with ParsingOptions and AnimationOptions, ElementChartOptions, PluginChartOptions, DatasetChartOptions, ScaleChartOptions and the chart options of each controller), the root options and Chart.defaults (index.d.ts:706 Defaults).
    keys:
      parsing: bool | scope ParsingOptions
      normalized: bool
      animation: bool | scope AnimationOptions
      animations: bool | scope AnimationsSpec
      transitions: scope TransitionsSpec
      datasets: scope DatasetOptionsByType
      indexAxis: string
      clip: number | bool | scope ChartArea
      color: any
      backgroundColor: any
      hoverBackgroundColor: any
      borderColor: any
      hoverBorderColor: any
      font: scope FontSpec
      responsive: bool
      maintainAspectRatio: bool
      resizeDelay: number
      aspectRatio: number
      locale: string
      onResize: fn
      devicePixelRatio: number
      interaction: scope InteractionOptions
      hover: scope InteractionOptions
      events: list
      onHover: fn
      onClick: fn
      layout: scope LayoutOptions
      elements: scope ElementOptionsByType
      plugins: scope PluginOptionsByType
      scales: scope ScaleOptionsById
      skipNull: bool  # index.d.ts:149 BarControllerChartOptions
      spanGaps: bool | number  # index.d.ts:216 LineControllerChartOptions
      showLine: bool
      circumference: number  # index.d.ts:307 DoughnutControllerChartOptions
      cutout: number | string
      offset: number
      radius: number | string
      rotation: number
      spacing: number
      spacingMode: string
      startAngle: number  # index.d.ts:400 PolarAreaControllerChartOptions
      scale: scope ScaleOptions  # index.d.ts:708 Defaults, only Chart.defaults has it
      hoverColor: any  # core.defaults.js:64
      drawActiveElementsOnTop: bool  # core.defaults.js:80
      # The keys of the dataset kinds that are not chart keys above, in the order of
      # DatasetOptionsByType: the dataset, element and animation resolution read the root options
      # as the scope '' (core.config.js:214, :229 and :252), and the chart options read
      # defaults.datasets.<type> (core.config.js:337).
      label: string
      order: number
      stack: string
      hidden: bool
      base: number
      borderSkipped: string | bool
      borderRadius: number | scope BorderRadius
      inflateAmount: number | string
      borderWidth: number | scope Padding
      hoverBorderWidth: number
      xAxisID: string
      yAxisID: string
      barPercentage: number
      categoryPercentage: number
      barThickness: number | string
      maxBarThickness: number
      minBarLength: number
      pointStyle: any
      grouped: bool
      tooltip: scope TooltipDatasetOptions
      type: string
      data: list
      hoverBorderRadius: number | scope BorderRadius
      rAxisID: string
      fill: number | string | bool | scope FillTarget
      datasetElementType: string | bool
      dataElementType: string | bool
      pointBackgroundColor: any
      pointBorderColor: any
      pointBorderWidth: number
      pointHitRadius: number
      pointRadius: number
      pointRotation: number
      pointHoverBackgroundColor: any
      pointHoverBorderColor: any
      pointHoverBorderWidth: number
      pointHoverRadius: number
      borderCapStyle: string
      borderDash: list
      borderDashOffset: number
      borderJoinStyle: string
      capBezierPoints: bool
      cubicInterpolationMode: string
      tension: number
      stepped: string | bool
      segment: scope SegmentOptions
      hoverBorderCapStyle: string
      hoverBorderDash: list
      hoverBorderDashOffset: number
      hoverBorderJoinStyle: string
      hitRadius: number
      hoverRadius: number
      selfJoin: bool
      borderAlign: string
      circular: bool
      hoverOffset: number
      weight: number
      angle: number
      cutoutPercentage: number
  PluginOptionsByType:

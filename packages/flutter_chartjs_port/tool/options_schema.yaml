    others: bool | scope GenericPluginOptions
    keys:
      colors: bool | scope ColorsOptions
      decimation: bool | scope DecimationOptions
      filler: bool | scope FillerOptions
      legend: bool | scope LegendOptions
      subtitle: bool | scope TitleOptions
      title: bool | scope TitleOptions

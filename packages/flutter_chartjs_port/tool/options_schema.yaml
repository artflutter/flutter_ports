  DatasetOptionsByType:
    doc: Port-only kind for index.d.ts:1631 CoreChartOptions `datasets` and index.d.ts:3831 DatasetChartOptions, the scope `datasets` (by chart type, index.d.ts:3755 ChartTypeRegistry order).
    others: scope GenericDatasetOptions
    keys:
      bar: scope BarControllerDatasetOptions
      line: scope LineControllerDatasetOptions
      scatter: scope LineControllerDatasetOptions
      bubble: scope BubbleControllerDatasetOptions
      pie: scope DoughnutControllerDatasetOptions
      doughnut: scope DoughnutControllerDatasetOptions
      polarArea: scope PolarAreaControllerDatasetOptions
      radar: scope RadarControllerDatasetOptions
  OverridesByType:
    doc: Port-only kind for index.d.ts:740 Overrides, Chart.overrides (core.defaults.js:7, by chart type).
    others: scope ChartOptions
    keys:
      bar: scope ChartOptions
      line: scope ChartOptions
      scatter: scope ChartOptions
      bubble: scope ChartOptions
      pie: scope ChartOptions

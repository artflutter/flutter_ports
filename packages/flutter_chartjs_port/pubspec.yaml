name: flutter_chartjs_port
description: >-
  A native Dart port of Chart.js for Flutter. Charts are drawn with Flutter's
  own canvas, with no WebView and no JavaScript. Work in progress.
version: 0.0.1
# Remove at the first release.
publish_to: none
repository: https://github.com/artflutter/flutter_ports/tree/main/packages/flutter_chartjs_port
issue_tracker: https://github.com/artflutter/flutter_ports/issues
topics:
  - chart
  - chartjs
  - graph
  - visualization
  - canvas

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  # jsDateNow reads clock.now(), the clock that the FakeAsync zone of
  # testWidgets moves (Chart.js ADR 0045 section 6). 1.1.2 is the version that
  # fake_async already resolves in the workspace.
  clock: ^1.1.2
  # jsSort calls mergeSort, a stable sort (Chart.js ADR 0045, Sort). 1.19.1 is
  # the lower bound of the collection constraint of Flutter 3.47.7.
  collection: ^1.19.1
  flutter:
    sdk: flutter
  # Numbers (js_intl.dart, Chart.js ADR 0026) and the date adapter
  # (porting-flow.md 2.10) format through intl. 0.20.2 is the constraint of
  # Chart.js ADR 0045 (the pin of flutter_localizations in Flutter 3.44.9).
  # flutter_localizations in Flutter 3.47.7 requires ^0.20.3.
  intl: ^0.20.2
  # @internal on underscore members that other modules read (Chart.js ADR
  # 0004).
  meta: ^1.18.0

dev_dependencies:
  # tool/check_js_semantics.dart resolves the types of interpolated values.
  # 12.1.0 is the version that test_core already resolves in the workspace.
  analyzer: ^12.1.0
  # The test harness (porting-flow.md section 3). It depends on this package;
  # the workspace resolves the cycle. A path dependency: the harness is not on
  # pub.dev, and pana drops a path dev_dependency (Chart.js ADR 0047).
  chartjs_test_utils:
    path: ../chartjs_test_utils
  flutter_test:
    sdk: flutter
  # Pure-layer specs and port tests run with `dart test` on the VM, dart2js and
  # dart2wasm (porting-flow.md section 3). 1.31.1 matches the test_api pin of
  # flutter_test in Flutter 3.47.7 (0.7.12).
  test: ^1.31.1
  # analysis_options.yaml includes its rules, as the root file does. pana
  # formats the package with them (Chart.js ADR 0047). The constraint is the
  # constraint of the root pubspec.
  very_good_analysis: ^10.3.0

# The projects that packages/flutter_d3_scale_chromatic_port ports code from
# (D3 ADR 0008). Each "// Ported from" header must name a project of this file,
# with the same license and holder. The only entry is d3-scale-chromatic. The
# package depends on flutter_d3_color_port and flutter_d3_interpolate_port, as
# the npm package d3-scale-chromatic depends on d3-color and d3-interpolate.
# flutter_d3_port depends on it.
#
# tool/check_upstream_pin.sh and the test/upstream_test.dart of this package
# and of flutter_d3_port read this file. The pin readers skip the top-level
# keys other than "sources".
#
# The header check of packages/flutter_chartjs_port/tool reads this file
# (check:headers with this package as its home package).
#
# Top-level keys before "sources":
# - marker: the tag of the DIVERGES markers, "// DIVERGES(d3-scale-chromatic):
#   <row id>, <reason>". The rows are in doc/differences.md.
#
# The keys of an entry are those of packages/flutter_d3_port/tool/
# port_sources.yaml. The pin is a release pin: "version" is
# "v<d3ScaleChromaticVersion>", and "ref" is the tag. "files" lists the ported
# source paths at the pin, so the header check needs no checkout of the
# submodule.
#
# All paths are relative to the repository root, except "source" and
# "files", which are relative to the project root.

marker: d3-scale-chromatic


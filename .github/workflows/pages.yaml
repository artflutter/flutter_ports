name: pages

# Deploys the documentation site on the newest stable Flutter:
#   https://artflutter.github.io/flutter_ports/docs/
#
# Deploys the API ergonomics samples on the newest stable Flutter:
#   https://artflutter.github.io/flutter_ports/ergonomics/
#
# Deploys the chart benchmark lab on the newest build of each Flutter channel:
#   https://artflutter.github.io/flutter_ports/lab-stable/
#   https://artflutter.github.io/flutter_ports/lab-beta/
#   https://artflutter.github.io/flutter_ports/lab-master/
#
# Deploys the live dashboard sample on the newest build of each Flutter channel,
# with its own page (tool/pages/dashboard.html), apart from the root page:
#   https://artflutter.github.io/flutter_ports/dashboard/
#   https://artflutter.github.io/flutter_ports/dashboard/stable/ (also beta/ and master/)
# Its build reads the URL and the publishable key of the Supabase project from
# the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.
#
# Deploys the combined D3 demo app on the newest build of each Flutter channel,
# with its own page (tool/pages/d3.html):
#   https://artflutter.github.io/flutter_ports/d3/
#   https://artflutter.github.io/flutter_ports/d3/stable/ (also beta/ and master/)
#
# These builds do not read .fvmrc. Each run takes the newest release of stable
# and of beta, and the head of the branch master.
#
# git-cliff computes the version of the lab from the commits after the last
# lab/v* tag (cliff.toml). Each build stamps it with --build-name, and the run
# number with --build-number. The page shows them at its bottom. A deploy pushes
# the tag of a new version.
#
# A repository has one Pages site, and a deploy replaces the whole site. Thus
# the job deploy assembles the site, with one folder for each page. A later app
# adds its build, its folder and its link on the root page.
#
# Pages cannot send the COOP and COEP headers. web/isolate.js of the lab and of the
# docs adds them through a service worker, so that WebAssembly gets its rendering
# thread there.

on:
  push:
    branches: [main]
    # The files that change the pages.
    paths:
      - .github/workflows/pages.yaml
      - apps/chart_benchmark_lab/lib/**
      - apps/chart_benchmark_lab/pubspec.yaml
      - apps/chart_benchmark_lab/web/**
      - apps/chartjs_docs/assets/**
      - apps/chartjs_docs/lib/**
      - apps/chartjs_docs/pubspec.yaml
      - apps/chartjs_docs/tool/**
      - apps/chartjs_docs/web/**
      - apps/chartjs_ergonomics/assets/**
      - apps/chartjs_ergonomics/lib/**
      - apps/chartjs_ergonomics/pubspec.yaml
      - apps/chartjs_ergonomics/web/**
      - apps/chartjs_supabase_dashboard/lib/**
      - apps/chartjs_supabase_dashboard/pubspec.yaml
      - apps/chartjs_supabase_dashboard/web/**
      - apps/d3_demo/lib/**
      - apps/d3_demo/pubspec.yaml
      - apps/d3_demo/web/**
      - packages/flutter_chartjs_chart_sankey_port/lib/**
      - packages/flutter_chartjs_chart_sankey_port/pubspec.yaml
      - packages/flutter_chartjs_plugin_zoom_port/lib/**
      - packages/flutter_chartjs_plugin_zoom_port/pubspec.yaml
      - packages/flutter_chartjs_port/lib/**
      - packages/flutter_chartjs_port/pubspec.yaml
      - packages/flutter_d3_array_port/lib/**
      - packages/flutter_d3_array_port/pubspec.yaml
      - packages/flutter_d3_chord_port/lib/**
      - packages/flutter_d3_chord_port/pubspec.yaml
      - packages/flutter_d3_color_port/lib/**
      - packages/flutter_d3_color_port/pubspec.yaml
      - packages/flutter_d3_contour_port/lib/**
      - packages/flutter_d3_contour_port/pubspec.yaml
      - packages/flutter_d3_delaunay_port/lib/**
      - packages/flutter_d3_delaunay_port/pubspec.yaml
      - packages/flutter_d3_format_port/lib/**
      - packages/flutter_d3_format_port/pubspec.yaml
      - packages/flutter_d3_hierarchy_port/lib/**
      - packages/flutter_d3_hierarchy_port/pubspec.yaml
      - packages/flutter_d3_interpolate_port/lib/**
      - packages/flutter_d3_interpolate_port/pubspec.yaml
      - packages/flutter_d3_path_port/lib/**
      - packages/flutter_d3_path_port/pubspec.yaml
      - packages/flutter_d3_quadtree_port/lib/**
      - packages/flutter_d3_quadtree_port/pubspec.yaml
      - packages/flutter_d3_scale_chromatic_port/lib/**
      - packages/flutter_d3_scale_chromatic_port/pubspec.yaml
      - packages/flutter_d3_shape_port/lib/**
      - packages/flutter_d3_shape_port/pubspec.yaml
      - packages/flutter_d3_time_port/lib/**
      - packages/flutter_d3_time_port/pubspec.yaml
      - pubspec.lock
      - tool/pages/**
  workflow_dispatch:

concurrency:
  # A newer push cancels the run in progress: only the newest commit deploys.
  # A cancelled run skips the deploy job, so the old pages stay.
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.git-cliff.outputs.version }}
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff reads the commits and the tags.
          fetch-depth: 0
      - id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.14.2
          config: cliff.toml
          args: --bump --unreleased
      - id: stamp
        name: Read the version
        env:
          TAG: ${{ steps.git-cliff.outputs.version }}
          NOTES: ${{ steps.git-cliff.outputs.changelog }}
        run: |
          case "$TAG" in
            lab/v[0-9]*) ;;
            *)
              echo "::error::git-cliff gave the version '$TAG'."
              exit 1
              ;;
          esac
          echo "version=${TAG#lab/v}" >> "$GITHUB_OUTPUT"
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      # A channel that fails does not stop the other channels.
      fail-fast: false
      matrix:
        channel: [stable, beta, master]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          # No version, so the action takes the newest build of the channel.
          channel: ${{ matrix.channel }}
          # The key of a release has its hash, so a new release misses the cache.
          # The key of master is fixed, so a hit would give an old master.
          cache: ${{ matrix.channel != 'master' }}
      - name: Resolve the lab alone
        working-directory: apps/chart_benchmark_lab
        # As an app that uses the port. The workspace also resolves the dev
        # dependencies of each package, and these can ask for more than the
        # flutter_test of a channel permits. The root lock file gives the first
        # choice of versions, where the channel permits them.
        run: |
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          # The zoom port names flutter_chartjs_port from pub.dev, and the app
          # names it by path: the override keeps the path.
          printf 'dependency_overrides:\n  flutter_chartjs_port:\n    path: ../../packages/flutter_chartjs_port\n' >> pubspec.yaml
          cp ../../pubspec.lock pubspec.lock
          flutter pub get
      - name: Build the lab for the web (WebAssembly + JavaScript fallback)
        working-directory: apps/chart_benchmark_lab
        # --web-content-hash puts a content hash into the file names of the
        # bundle and the assets, so a new build misses the browser cache.
        run: |
          flutter build web --wasm --web-content-hash \
            --base-href /flutter_ports/lab-${{ matrix.channel }}/ \
            --build-name ${{ needs.version.outputs.version }} \
            --build-number ${{ github.run_number }}
      - name: Put the build into its folder
        run: |
          mkdir site
          cp -R apps/chart_benchmark_lab/build/web site/lab-${{ matrix.channel }}
          # The root page shows this version.
          flutter --version --machine > site/lab-${{ matrix.channel }}/flutter.json
      # The artifact holds the folder. With one artifact, download-artifact puts
      # the files in its path with no folder of the artifact name.
      - uses: actions/upload-artifact@v7
        with:
          name: lab-${{ matrix.channel }}
          path: site
          if-no-files-found: error

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve the docs alone
        working-directory: apps/chartjs_docs
        # For the same reason as the lab.
        run: |
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          # The zoom port names flutter_chartjs_port from pub.dev, and the app
          # names it by path: the override keeps the path.
          printf 'dependency_overrides:\n  flutter_chartjs_port:\n    path: ../../packages/flutter_chartjs_port\n' >> pubspec.yaml
          cp ../../pubspec.lock pubspec.lock
          flutter pub get
      - name: Build the docs for the web (WebAssembly + JavaScript fallback)
        working-directory: apps/chartjs_docs
        run: flutter build web --wasm --web-content-hash --base-href /flutter_ports/docs/
      - name: Put the build into its folder
        run: |
          mkdir site
          cp -R apps/chartjs_docs/build/web site/docs
      - name: Pack the samples for the DartPad links
        working-directory: apps/chartjs_docs
        run: dart tool/dartpad_archives.dart ../../site/docs/dartpad
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: site
          if-no-files-found: error

  build-ergonomics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve the ergonomics app alone
        working-directory: apps/chartjs_ergonomics
        # For the same reason as the lab.
        run: |
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          cp ../../pubspec.lock pubspec.lock
          flutter pub get
      - name: Build the ergonomics app for the web (WebAssembly + JavaScript fallback)
        working-directory: apps/chartjs_ergonomics
        run: flutter build web --wasm --web-content-hash --base-href /flutter_ports/ergonomics/
      - name: Put the build into its folder
        run: |
          mkdir site
          cp -R apps/chartjs_ergonomics/build/web site/ergonomics
      - uses: actions/upload-artifact@v7
        with:
          name: ergonomics
          path: site
          if-no-files-found: error

  build-dashboard:
    runs-on: ubuntu-latest
    strategy:
      # A channel that fails does not stop the other channels.
      fail-fast: false
      matrix:
        channel: [stable, beta, master]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: ${{ matrix.channel != 'master' }}
      - name: Resolve the dashboard alone
        working-directory: apps/chartjs_supabase_dashboard
        # For the same reason as the lab.
        run: |
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          # The zoom port names flutter_chartjs_port from pub.dev, and the app
          # names it by path: the override keeps the path.
          printf 'dependency_overrides:\n  flutter_chartjs_port:\n    path: ../../packages/flutter_chartjs_port\n' >> pubspec.yaml
          cp ../../pubspec.lock pubspec.lock
          flutter pub get
      - name: Write the Supabase settings
        working-directory: apps/chartjs_supabase_dashboard
        # A publishable key is public: the page sends it with each request.
        # The row level security of supabase/schema.sql limits what it can do.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo '::error::Set the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY.'
            exit 1
          fi
          jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key}' > supabase.json
      - name: Build the dashboard for the web (WebAssembly + JavaScript fallback)
        working-directory: apps/chartjs_supabase_dashboard
        # --web-content-hash puts a content hash into the file names of the
        # bundle and the assets (main.dart.<hash>.js), so a new build misses
        # the browser cache.
        run: |
          flutter build web --wasm --web-content-hash \
            --base-href /flutter_ports/dashboard/${{ matrix.channel }}/ \
            --dart-define-from-file=supabase.json
      - name: Put the build into its folder
        run: |
          mkdir -p site/dashboard
          cp -R apps/chartjs_supabase_dashboard/build/web site/dashboard/${{ matrix.channel }}
          # The dashboard page shows this version.
          flutter --version --machine > site/dashboard/${{ matrix.channel }}/flutter.json
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ matrix.channel }}
          path: site
          if-no-files-found: error

  build-d3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta, master]
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          cache: ${{ matrix.channel != 'master' }}
      - name: Resolve the D3 demo alone
        working-directory: apps/d3_demo
        run: |
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          printf 'dependency_overrides:\n  flutter_d3_array_port:\n    path: ../../packages/flutter_d3_array_port\n  flutter_d3_chord_port:\n    path: ../../packages/flutter_d3_chord_port\n  flutter_d3_color_port:\n    path: ../../packages/flutter_d3_color_port\n  flutter_d3_contour_port:\n    path: ../../packages/flutter_d3_contour_port\n  flutter_d3_delaunay_port:\n    path: ../../packages/flutter_d3_delaunay_port\n  flutter_d3_format_port:\n    path: ../../packages/flutter_d3_format_port\n  flutter_d3_hierarchy_port:\n    path: ../../packages/flutter_d3_hierarchy_port\n  flutter_d3_interpolate_port:\n    path: ../../packages/flutter_d3_interpolate_port\n  flutter_d3_path_port:\n    path: ../../packages/flutter_d3_path_port\n  flutter_d3_quadtree_port:\n    path: ../../packages/flutter_d3_quadtree_port\n  flutter_d3_scale_chromatic_port:\n    path: ../../packages/flutter_d3_scale_chromatic_port\n  flutter_d3_shape_port:\n    path: ../../packages/flutter_d3_shape_port\n  flutter_d3_time_port:\n    path: ../../packages/flutter_d3_time_port\n' >> pubspec.yaml
          cp ../../pubspec.lock pubspec.lock
          flutter pub get
      - name: Build the D3 demo for the web (WebAssembly + JavaScript fallback)
        working-directory: apps/d3_demo
        run: |
          flutter build web --wasm --web-content-hash \
            --base-href /flutter_ports/d3/${{ matrix.channel }}/
      - name: Put the build into its folder
        run: |
          mkdir -p site/d3
          cp -R apps/d3_demo/build/web site/d3/${{ matrix.channel }}
          flutter --version --machine > site/d3/${{ matrix.channel }}/flutter.json
      - uses: actions/upload-artifact@v7
        with:
          name: d3-${{ matrix.channel }}
          path: site
          if-no-files-found: error

  deploy:
    needs: [version, build, build-docs, build-ergonomics, build-dashboard, build-d3]
    # A build that failed does not stop the other pages.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tool/pages
      - uses: actions/download-artifact@v8
        with:
          pattern: lab-*
          merge-multiple: true
          path: site
      - uses: actions/download-artifact@v8
        # A failed build of the docs has no artifact. The next step says so.
        continue-on-error: true
        with:
          name: docs
          path: site
      - uses: actions/download-artifact@v8
        # A failed build of the ergonomics app has no artifact. The next step
        # says so.
        continue-on-error: true
        with:
          name: ergonomics
          path: site
      - uses: actions/download-artifact@v8
        # A channel that failed has no artifact. The next step says so.
        continue-on-error: true
        with:
          pattern: dashboard-*
          merge-multiple: true
          path: site
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: d3-*
          merge-multiple: true
          path: site
      - name: Assemble the site
        env:
          LAB_VERSION: ${{ needs.version.outputs.version }}+${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p site
          sed "s|{{lab}}|$LAB_VERSION|" tool/pages/index.html > site/index.html
          built=0
          for channel in stable beta master; do
            if [ -d "site/lab-$channel" ]; then
              built=$((built + 1))
              # A file that cannot be read must not stop the deploy.
              version=$(jq -r '.frameworkVersion // "unknown"' "site/lab-$channel/flutter.json" 2>/dev/null) || version=unknown
              status="Flutter $version"
            else
              status='Did not build in this run'
              # The page of this channel says so. It does not keep an old Flutter.
              mkdir -p "site/lab-$channel"
              printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<title>Chart benchmark lab</title>\n<p>The lab did not build on the newest Flutter %s. <a href="%s">Read the run</a>.</p>\n</html>\n' \
                "$channel" "$RUN_URL" > "site/lab-$channel/index.html"
            fi
            sed -i "s|{{$channel}}|$status|" site/index.html
          done
          # With no build at all, the deploy stops, so that the old pages stay.
          if [ "$built" -eq 0 ]; then
            echo '::error::The lab did not build on any channel.'
            exit 1
          fi
          # The page of the docs says so. It does not keep an old build.
          if [ ! -d site/docs ]; then
            echo '::warning::The docs did not build in this run.'
            mkdir -p site/docs
            printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<title>Chart.js for Flutter</title>\n<p>The docs did not build in this run. <a href="%s">Read the run</a>.</p>\n</html>\n' \
              "$RUN_URL" > site/docs/index.html
          fi
          # The page of the ergonomics app says so. It does not keep an old build.
          if [ ! -d site/ergonomics ]; then
            echo '::warning::The ergonomics app did not build in this run.'
            mkdir -p site/ergonomics
            printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<title>API ergonomics</title>\n<p>The ergonomics app did not build in this run. <a href="%s">Read the run</a>.</p>\n</html>\n' \
              "$RUN_URL" > site/ergonomics/index.html
          fi
          # The dashboard: its own page, and one folder for each channel. Its
          # builds do not stop the deploy.
          mkdir -p site/dashboard
          sed "s|{{built}}|from ${GITHUB_SHA::8} in run $GITHUB_RUN_NUMBER|" \
            tool/pages/dashboard.html > site/dashboard/index.html
          for channel in stable beta master; do
            if [ -d "site/dashboard/$channel" ]; then
              version=$(jq -r '.frameworkVersion // "unknown"' "site/dashboard/$channel/flutter.json" 2>/dev/null) || version=unknown
              status="Flutter $version"
            else
              echo "::warning::The dashboard did not build on $channel in this run."
              status='Did not build in this run'
              mkdir -p "site/dashboard/$channel"
              printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<title>Live dashboard</title>\n<p>The dashboard did not build on the newest Flutter %s. <a href="%s">Read the run</a>.</p>\n</html>\n' \
                "$channel" "$RUN_URL" > "site/dashboard/$channel/index.html"
            fi
            sed -i "s|{{$channel}}|$status|" site/dashboard/index.html
          done
          # The combined D3 demo: its own page, and one folder for each channel.
          mkdir -p site/d3
          sed "s|{{built}}|from ${GITHUB_SHA::8} in run $GITHUB_RUN_NUMBER|" \
            tool/pages/d3.html > site/d3/index.html
          for channel in stable beta master; do
            if [ -d "site/d3/$channel" ]; then
              version=$(jq -r '.frameworkVersion // "unknown"' "site/d3/$channel/flutter.json" 2>/dev/null) || version=unknown
              status="Flutter $version"
            else
              echo "::warning::The D3 demo did not build on $channel in this run."
              status='Did not build in this run'
              mkdir -p "site/d3/$channel"
              printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<title>D3 for Flutter</title>\n<p>The D3 demo did not build on the newest Flutter %s. <a href="%s">Read the run</a>.</p>\n</html>\n' \
                "$channel" "$RUN_URL" > "site/d3/$channel/index.html"
            fi
            sed -i "s|{{$channel}}|$status|" site/d3/index.html
          done
          # The old address of the lab goes to the root page.
          mkdir site/lab
          cat > site/lab/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../">
          <title>flutter_ports</title>
          <a href="../">Chart benchmark lab</a>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Tag the version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # A run with no new commit of the lab keeps the tag of the last version.
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" --silent
          fi

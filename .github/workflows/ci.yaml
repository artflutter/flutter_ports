name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: dart run melos run format:check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: dart run melos run analyze

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: dart run melos run test --no-select

  gallery-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the gallery for the web (WebAssembly + JavaScript fallback)
        working-directory: apps/chartjs_gallery
        run: flutter build web --wasm

  upstream-pin:
    # The third_party/Chart.js gitlink must be the commit of the release tag
    # named by chartJsVersion. Needs no submodule checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tool/check_upstream_pin.sh

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  dco:
    # Every commit in a pull request carries a Signed-off-by trailer (CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git show -s --format='%h %s' "$commit") is not signed off (git commit -s)"
              status=1
            fi
          done
          exit $status

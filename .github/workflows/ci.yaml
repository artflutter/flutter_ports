name: ci

on:
  pull_request:
  push:
    branches: [main]
  # A manual run: each job runs. With update_goldens, the job fixtures
  # writes the theme goldens on its pinned runner and uploads them as the
  # artifact theme-goldens (Chart.js ADR 0050, "Goldens").
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Write the theme goldens and upload them
        type: boolean
        default: false
      flutter_version:
        description: Flutter for the goldens; empty is .fvmrc
        type: string
        default: ""

concurrency:
  # The event name keeps a manual run and a push run of one branch apart.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: dart run melos run format:check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: dart run melos run analyze

  test:
    # Each leg runs one of three shards of the tests on one OS. package:test
    # puts a part of the tests of each test file in each shard. The tests of
    # a file run in the order of the file in each shard.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # On ubuntu only, this step checks out shallow submodules by path.
      # packages/flutter_chartjs_port/test/upstream_test.dart compares the part of
      # chartJsVersion before "+" with third_party/Chart.js/package.json.
      # packages/flutter_d3_port/test/upstream_test.dart compares d3Version
      # with third_party/d3/package.json. CI does not clone the 33 other D3
      # repositories. packages/flutter_echarts_port/test/upstream_test.dart
      # compares echartsVersion and zrenderVersion with the package.json
      # files of third_party/echarts and third_party/zrender. Each shard runs
      # a part of the tests of each upstream_test.dart. Thus each ubuntu leg
      # makes the checkout.
      - name: Check out the Chart.js submodules, third_party/d3 and the ECharts submodules
        if: matrix.os == 'ubuntu-latest'
        run: git submodule update --init --depth 1 -- third_party/Chart.js third_party/kurkle-color third_party/chartjs-test-utils third_party/d3 third_party/echarts third_party/zrender
      - uses: ./.github/actions/setup
      # Melos gives the options after "--" to each flutter test call.
      # --experimental-faster-testing compiles the test files of a package
      # into one test app. The bash shell (Git Bash on Windows) passes "--"
      # the same way on the three OSes.
      - name: Run shard ${{ matrix.shard }} of the tests
        shell: bash
        run: dart run melos run test --no-select -- --experimental-faster-testing --total-shards=3 --shard-index=${{ matrix.shard }}
      # Tool 5 runs all spec tests. Thus only one leg runs it.
      - name: Report the upstream spec cases (porting-flow.md section 4, tool 5)
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 0
        run: dart run melos run test:cases

  test-web:
    # The flutter_chartjs_port and chartjs_test_utils tests that are not
    # @TestOn('vm'), compiled with dart2js and dart2wasm, in the Chrome of the
    # runner image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: dart run melos run test:web

  fixtures:
    # Tool 7 of packages/flutter_chartjs_port/doc/porting-flow.md section 4
    # (Chart.js ADR 0029, section 3 item 5 and section 11). The runner reads the
    # configs from committed files: doc/upstream/manifest.json,
    # doc/upstream/fixtures.json and test/fixtures/. It compares the SHA-256
    # of each upstream fixture file with the manifest. Thus the job makes a
    # shallow checkout of third_party/Chart.js. FIXTURES_REQUIRED=1 makes a
    # fixture fail, not skip, when the checkout is missing.
    #
    # The job is also the pinned runner of the theme goldens of
    # packages/flutter_chartjs_port/doc/theming.md section 8 test 9 (Chart.js
    # ADR 0050, "Goldens"). The font manager of the platform rasterizes the
    # text (FreeType on Linux), so the image is pinned: ubuntu-24.04, not
    # ubuntu-latest. CHART_GOLDENS=1 runs the goldens; elsewhere they skip.
    # Only a workflow_dispatch run with update_goldens writes the golden
    # files, and uploads them as the artifact theme-goldens. With
    # flutter_version, that run first writes .fvmrc with that version, for
    # the move to a new Flutter.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Use the Flutter version of the dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.flutter_version != ''
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
        run: |
          printf '{\n  "flutter": "%s"\n}\n' "$FLUTTER_VERSION" > .fvmrc
          cat .fvmrc
      - name: Check out third_party/Chart.js
        run: git submodule update --init --depth 1 -- third_party/Chart.js
      - uses: ./.github/actions/setup
      - if: ${{ !inputs.update_goldens }}
        run: dart run melos run test:fixtures
        env:
          FIXTURES_REQUIRED: "1"
      - name: Compare the theme goldens
        if: ${{ !inputs.update_goldens }}
        run: dart run melos run test:goldens
        env:
          CHART_GOLDENS: "1"
      - name: Write the theme goldens
        if: ${{ inputs.update_goldens }}
        run: dart run melos run test:goldens -- --update-goldens
        env:
          CHART_GOLDENS: "1"
      # A write run fails when it has no golden file. After a failure of
      # another run, the step uploads the failures/ images of the goldens,
      # if there are any.
      - name: Upload the theme goldens
        if: ${{ inputs.update_goldens || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: theme-goldens
          path: |
            packages/flutter_chartjs_port/test/port/theme/goldens/*.png
            packages/flutter_chartjs_port/test/port/theme/failures/
          if-no-files-found: ${{ inputs.update_goldens && 'error' || 'ignore' }}

  test-nofast:
    # The tests of packages/flutter_chartjs_port with every fast path of
    # Chart.js ADR 0053 off (--dart-define=PORT_FAST_PATHS=false): the spec,
    # fixture and reference suites run on the ported forms only. One shard:
    # the run takes about one minute on a 16-core Mac. The fixtures compare
    # the SHA-256 of each upstream fixture file, so the job checks out the
    # Chart.js submodules, and FIXTURES_REQUIRED=1 makes a missing file fail.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the Chart.js submodules
        run: git submodule update --init --depth 1 -- third_party/Chart.js third_party/kurkle-color third_party/chartjs-test-utils
      - uses: ./.github/actions/setup
      - run: dart run melos run test:nofast
        env:
          FIXTURES_REQUIRED: "1"

  port-checks:
    # Tools 1-3 and the checks of tools 6 and 8 of
    # packages/flutter_chartjs_port/doc/porting-flow.md section 4. parity:check
    # runs the spec tests of flutter_chartjs_port for the case counts.
    # Shallow submodules, so that the header check compares each header path
    # and each "files" entry of tool/port_sources.yaml with the pinned tree.
    # The job checks out only the Chart.js submodules, by path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out the Chart.js submodules
        run: git submodule update --init --depth 1 -- third_party/Chart.js third_party/kurkle-color third_party/chartjs-test-utils
      - uses: ./.github/actions/setup
      - run: dart run melos run check:lib-imports
      - run: dart run melos run check:headers
      - run: dart run melos run check:js-semantics
      - run: dart run melos run port:next:check
      - run: dart run melos run parity:check

  upstream-manifest:
    # Tool 4 of packages/flutter_chartjs_port/doc/porting-flow.md section 4. The
    # committed doc/upstream files equal the output for the pinned
    # third_party/Chart.js. This is the only CI job that runs Node.js.
    # The tool reads only third_party/Chart.js. Thus the job checks out only that
    # submodule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out third_party/Chart.js
        run: git submodule update --init --depth 1 -- third_party/Chart.js
      - uses: actions/setup-node@v6
        with:
          node-version: 24.12.0
      - name: Test the manifest generator
        working-directory: packages/flutter_chartjs_port
        run: node --test tool/upstream_manifest/test/*.test.mjs
      - name: Regenerate the upstream manifest
        working-directory: packages/flutter_chartjs_port
        run: node tool/upstream_manifest/upstream_manifest.mjs --src ../../third_party/Chart.js --out doc/upstream/manifest.json
      - name: Fail when the committed manifest differs
        run: |
          git diff --exit-code -- packages/flutter_chartjs_port/doc/upstream
          untracked=$(git status --porcelain --untracked-files=all -- packages/flutter_chartjs_port/doc/upstream)
          if [ -n "$untracked" ]; then
            echo "::error::uncommitted files: $untracked (run dart run melos run upstream:manifest)"
            exit 1
          fi

  gallery-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the gallery for the web (WebAssembly + JavaScript fallback)
        run: dart run melos run gallery:build:web

  gallery-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17 # the gallery's Gradle build targets JVM 17
          cache: gradle
      - uses: ./.github/actions/setup
      - name: Build the gallery for Android (debug APK)
        run: dart run melos run gallery:build:android

  gallery-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the gallery for iOS (no code signing)
        run: dart run melos run gallery:build:ios

  upstream-pin:
    # The third_party/Chart.js gitlink must be the commit of the release tag
    # named by chartJsVersion. For a commit pin "<last version>+<sha8>", the
    # gitlink must start with <sha8>. The third_party/d3 gitlink must be the
    # commit of the release tag named by d3Version. Each other D3 gitlink must
    # be the commit of its tag in packages/flutter_d3_port/tool/port_sources.yaml.
    # The third_party/echarts and third_party/zrender gitlinks must be the
    # commits of the release tags named by echartsVersion and zrenderVersion.
    # Each submodule of .gitmodules must be the pin of a port_sources.yaml
    # entry. Needs no submodule checkout.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tool/check_upstream_pin.sh

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  dco:
    # Every commit in a pull request carries a Signed-off-by trailer (CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git show -s --format='%h %s' "$commit") is not signed off (git commit -s)"
              status=1
            fi
          done
          exit $status

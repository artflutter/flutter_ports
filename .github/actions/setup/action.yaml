name: Setup workspace
description: Installs the Flutter version pinned in .fvmrc and resolves the pub workspace. Checkout is done by the caller.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        # The action looks for the version in this channel, and its default
        # is stable. A move of .fvmrc to another channel changes this line.
        channel: beta
        flutter-version-file: .fvmrc
        cache: true
    - name: Resolve workspace
      shell: bash
      # Every Dart tool, including `dart format`, needs the resolved workspace:
      # the formatter settings come from very_good_analysis via analysis_options.yaml.
      run: flutter pub get

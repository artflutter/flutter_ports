name: flutter_ports_workspace
description: Native Dart/Flutter ports of popular JavaScript chart libraries.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/flutter_chartjs_port
  - packages/chartjs_test_utils
  - packages/flutter_d3_port
  - packages/flutter_echarts_port
  - packages/flutter_chartjs_plugin_zoom_port
  - packages/flutter_chartjs_chart_sankey_port
  - packages/flutter_kurkle_color_port
  - packages/flutter_d3_color_port
  - packages/flutter_d3_interpolate_port
  - packages/flutter_d3_scale_chromatic_port
  - packages/flutter_d3_path_port
  - packages/flutter_d3_shape_port
  - packages/flutter_d3_format_port
  - packages/flutter_d3_array_port
  - packages/flutter_d3_contour_port
  - packages/flutter_d3_quadtree_port
  - apps/chartjs_gallery
  - apps/chart_benchmark_lab
  - apps/chartjs_docs
  - apps/chartjs_supabase_dashboard
  - apps/chartjs_ergonomics
  - apps/d3_demo

dev_dependencies:
  commitlint_cli: ^0.8.1
  melos: ^8.9.0
  very_good_analysis: ^11.0.0

melos:
  scripts:
    benchmark:macos:
      run: cd apps/chart_benchmark_lab && flutter run --profile -d macos
      stdio: inherit
      description: Run the cross-library chart benchmark in native macOS profile mode.
    benchmark:web:
      run: cd apps/chart_benchmark_lab && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      stdio: inherit
      description: Preview the cross-library chart benchmark in Chrome.
    benchmark:build:web:
      run: cd apps/chart_benchmark_lab && flutter build web --wasm --web-content-hash
      description: Build the chart benchmark for web with a JavaScript fallback and content-hashed file names.
    docs:
      run: cd apps/chartjs_docs && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      stdio: inherit
      description: Run the documentation site in Chrome.
    ergonomics:
      run: cd apps/chartjs_ergonomics && flutter run -d chrome
      stdio: inherit
      description: Run the API ergonomics samples (a chart and its code for each feature) in Chrome.
    dashboard:
      run: cd apps/chartjs_supabase_dashboard && flutter run -d chrome --dart-define-from-file=supabase.json
      stdio: inherit
      description: Run the live Supabase dashboard sample in Chrome (needs apps/chartjs_supabase_dashboard/supabase.json).
    docs:build:web:
      run: cd apps/chartjs_docs && flutter build web --wasm --web-content-hash
      description: Build the documentation site for the web (WebAssembly with a JavaScript fallback, content-hashed file names).
    d3:demo:
      run: cd apps/d3_demo && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      stdio: inherit
      description: Run the combined D3 demo app in Chrome.
    d3:demo:build:web:
      run: cd apps/d3_demo && flutter build web --wasm --web-content-hash
      description: Build the combined D3 demo app for the web (WebAssembly with a JavaScript fallback, content-hashed file names).
    format:
      run: dart format .
      description: Format all Dart code.
    format:check:
      run: dart format --output=none --set-exit-if-changed .
      description: Fail if any Dart file is not formatted.
    analyze:
      run: dart analyze --fatal-infos
      description: Analyze the whole workspace.
    test:
      description: Run the tests of every package that has a test/ directory, without the fixture smoke tests (the tag fixtures, Chart.js ADR 0029) and the theme goldens (the tag golden, Chart.js ADR 0147). Options go after "--" and go to each flutter test call, for example "dart run melos run test --no-select -- --experimental-faster-testing --total-shards=3 --shard-index=0" (one compiled test app for each package, and the first of three shards, as in CI).
      exec:
        command: flutter test --exclude-tags fixtures,golden
        concurrency: 2
        failFast: true
      packageFilters:
        dirExists: test
    test:web:
      run: dart run packages/flutter_chartjs_port/tool/test_web.dart
      description: Run the flutter_chartjs_port, chartjs_test_utils, flutter_kurkle_color_port, flutter_d3_port, flutter_d3_color_port, flutter_d3_interpolate_port, flutter_d3_scale_chromatic_port, flutter_d3_path_port, flutter_d3_shape_port, flutter_d3_format_port, flutter_d3_array_port, flutter_d3_contour_port and flutter_d3_quadtree_port tests that are not @TestOn('vm') through Flutter in Chrome, with JavaScript and WebAssembly.
    test:goldens:
      run: cd packages/flutter_chartjs_port && flutter test --tags golden test/port/theme/goldens_test.dart
      description: Run the theme goldens of flutter_chartjs_port (Chart.js ADR 0147). They skip unless CHART_GOLDENS=1. Only the CI job fixtures on ubuntu-24.04 sets it. Options go after "--", for example "dart run melos run test:goldens -- --update-goldens" (write the golden files; only the workflow_dispatch run of CI with update_goldens does this).

    # The per-module tools of packages/flutter_chartjs_port/doc/porting-flow.md section 4.
    # check:headers also examines the add-on ports flutter_chartjs_plugin_zoom_port and flutter_chartjs_chart_sankey_port (ADR 0009 item 6).
    check:headers:
      run: dart run packages/flutter_chartjs_port/tool/check_port_headers.dart && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_chartjs_plugin_zoom_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_chartjs_chart_sankey_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_kurkle_color_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_color_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_interpolate_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_scale_chromatic_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_path_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_shape_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_format_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_array_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_contour_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_d3_quadtree_port
      description: Fail on flutter_chartjs_port, chartjs_test_utils, flutter_chartjs_plugin_zoom_port, flutter_chartjs_chart_sankey_port, flutter_kurkle_color_port, flutter_d3_port, flutter_d3_color_port, flutter_d3_interpolate_port, flutter_d3_scale_chromatic_port, flutter_d3_path_port, flutter_d3_shape_port, flutter_d3_format_port, flutter_d3_array_port, flutter_d3_contour_port and flutter_d3_quadtree_port file headers, DIVERGES markers or port_sources.yaml entries that break the rules. Each add-on package, the color packages, the D3 package and the D3 module packages run as their own home package.
    options:gen:
      run: dart run packages/flutter_chartjs_port/tool/options_gen.dart
      description: Write the typed option scopes of flutter_chartjs_port (lib/src/options/*.g.dart) from tool/options_schema.yaml, formatted (Chart.js ADR 0054).
    options:gen:check:
      run: dart run packages/flutter_chartjs_port/tool/options_gen.dart --check
      description: Fail when a generated file of flutter_chartjs_port lib/src/options/ differs from the output of tool/options_schema.yaml, or when that folder has a .g.dart file that the generator does not write.
    fixtures:gen:
      run: dart run packages/flutter_chartjs_port/tool/fixture_configs_gen.dart
      description: Write test/fixtures/data_fixtures.g.dart of flutter_chartjs_port, the typed configs of the pure data fixtures of doc/upstream/fixtures.json without a hand port, formatted (Chart.js ADR 0199).
    fixtures:gen:check:
      run: dart run packages/flutter_chartjs_port/tool/fixture_configs_gen.dart --check
      description: Fail when test/fixtures/data_fixtures.g.dart of flutter_chartjs_port differs from the output of doc/upstream/fixtures.json and the hand ports.
    check:typed-reads:
      run: dart run packages/flutter_chartjs_port/tool/check_typed_reads.dart
      description: Fail when a count of the by-name forms (jsGet, jsGetKey, string index, jsCall, jsObjectKeys, extends MapBase, with MapMixin, implements Map) in a flutter_chartjs_port lib/src file outside lib/src/js/ and lib/src/options/ is above its baseline in tool/typed_reads/, or when a baseline is stale, and on a class of lib/src outside lib/src/js/ with a Map supertype, the structural rule (tool 9). Options go after "--", for example "dart run melos run check:typed-reads -- --update" (write the baselines from the current tree).
    adr:index:
      run: dart run tool/adr_index.dart
      description: Write the list in the README.md of each ADR folder from the ADR headers (docs/adr/README.md).
    adr:index:check:
      run: dart run tool/adr_index.dart --check
      description: Fail when the list of an ADR folder is stale, or when a "Supersedes" line has no matching "Superseded by" or "Superseded in part by" line, or the reverse.
    check:port:
      steps:
        - check:headers
        - check:typed-reads
        - options:gen:check
        - fixtures:gen:check
        - adr:index:check
      description: Run check:headers, check:typed-reads, options:gen:check, fixtures:gen:check and adr:index:check.
    test:fixtures:
      run: dart run packages/flutter_chartjs_port/tool/spec_cases.dart --fixtures
      description: Run the fixture smoke tests of flutter_chartjs_port (tool 7) and report each fixture as passed, failed, skipped or missing. Fail on a failed, missing or unknown fixture and on a bad skip reason. Without the submodule third_party/Chart.js, each fixture skips; with FIXTURES_REQUIRED=1, it fails.
    test:fixtures:zoom:
      run: cd packages/flutter_chartjs_plugin_zoom_port && flutter test --tags fixtures test/specs/fixtures_test.dart
      description: Run the 12 upstream fixtures of flutter_chartjs_plugin_zoom_port (the tag fixtures, seam H24) and compare their scale ranges at the snapshot points with test/fixtures/fixtures_reference.dart. Without the submodule third_party/chartjs-plugin-zoom, each fixture skips; with FIXTURES_REQUIRED=1, it fails.
    test:fixtures:sankey:
      run: cd packages/flutter_chartjs_chart_sankey_port && flutter test --tags fixtures test/specs/fixtures_test.dart
      description: Run the 44 upstream fixtures of flutter_chartjs_chart_sankey_port (the tag fixtures) and compare their observations (the nodes, the flows and the draw calls) with test/fixtures/fixtures_reference.dart. Without the submodule third_party/chartjs-chart-sankey, each fixture skips; with FIXTURES_REQUIRED=1, it fails.
    test:zoom:range-only:
      run: cd packages/flutter_chartjs_plugin_zoom_port && flutter test --dart-define=ZOOM_RANGE_ONLY_UPDATES=true
      description: Run the tests of flutter_chartjs_plugin_zoom_port, the fixtures among them, with the zoom option rangeOnlyUpdates true in Chart.defaults.plugins.zoom, so each zoom and pan takes chart.updateRanges (Chart.js ADR 0111). The results are those of the run without it.
    test:cases:
      run: dart run packages/flutter_chartjs_port/tool/spec_cases.dart
      description: Run the flutter_chartjs_port spec tests and report each upstream case as passed, failed, skipped or missing (tool 5). Fail on unknown test names and on missing cases of ported modules.

    upstream:
      run: git submodule update --init --depth 1
      description: Check out every pinned third_party/ submodule (Chart.js, @kurkle/color, chartjs-test-utils, d3 and the 33 other D3 repositories, Apache ECharts, zrender, chartjs-plugin-zoom and chartjs-chart-sankey). Reference for porting, not shipped.
    upstream:check:
      run: bash tool/check_upstream_pin.sh
      description: Fail unless third_party/Chart.js is pinned to the release tag named by chartJsVersion (for a commit pin <last version>+<sha8>, to a commit that starts with <sha8>), third_party/d3 to the release tag named by d3Version, each other D3 submodule to the commit of its tag in packages/flutter_d3_port/tool/port_sources.yaml, third_party/echarts and third_party/zrender to the release tags named by echartsVersion and zrenderVersion, third_party/chartjs-plugin-zoom to the commit of chartjsPluginZoomVersion (a commit pin <last version>+<sha8>, after the tag v<last version>), third_party/chartjs-chart-sankey to the release tag named by chartjsChartSankeyVersion, third_party/d3-color to the release tag named by d3ColorVersion, third_party/d3-interpolate to the release tag named by d3InterpolateVersion, third_party/d3-scale-chromatic to the release tag named by d3ScaleChromaticVersion, third_party/d3-path to the release tag named by d3PathVersion, third_party/d3-shape to the release tag named by d3ShapeVersion, third_party/d3-format to the release tag named by d3FormatVersion, third_party/d3-array to the release tag named by d3ArrayVersion, third_party/d3-contour to the release tag named by d3ContourVersion, and third_party/d3-quadtree to the release tag named by d3QuadtreeVersion.
    upstream:manifest:
      run: cd packages/flutter_chartjs_port && node tool/upstream_manifest/upstream_manifest.mjs --src ../../third_party/Chart.js --out doc/upstream/manifest.json
      description: Write packages/flutter_chartjs_port/doc/upstream/manifest.json and fixtures.json from third_party/Chart.js (tool 4). Needs Node.js 22.18 or later (CI uses 24.12.0) and the submodule (melos run upstream).

    gallery:
      run: cd apps/chartjs_gallery && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      # A real terminal, so flutter run's hot reload/restart/quit keys work.
      stdio: inherit
      description: Run the Chart.js gallery in Chrome.
    gallery:macos:
      run: cd apps/chartjs_gallery && flutter run -d macos
      stdio: inherit
      description: Run the Chart.js gallery as a macOS app.
    gallery:device:
      run: cd apps/chartjs_gallery && flutter run
      stdio: inherit
      description: Run the Chart.js gallery on a connected Android/iOS device, emulator or simulator (flutter asks when there are several).
    gallery:build:web:
      run: cd apps/chartjs_gallery && flutter build web --wasm --web-content-hash
      description: Build the gallery for the web (WebAssembly with a JavaScript fallback, content-hashed file names).
    gallery:build:android:
      run: cd apps/chartjs_gallery && flutter build apk --debug
      description: Build a debug APK of the gallery.
    gallery:build:ios:
      run: cd apps/chartjs_gallery && flutter build ios --debug --no-codesign
      description: Build the gallery for iOS without code signing.

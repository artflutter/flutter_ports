name: flutter_ports_workspace
description: Native Dart/Flutter ports of popular JavaScript chart libraries.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/flutter_chartjs_port
  - packages/chartjs_test_utils
  - packages/flutter_d3_port
  - packages/flutter_echarts_port
  - packages/flutter_chartjs_plugin_zoom_port
  - packages/flutter_chartjs_chart_sankey_port
  - packages/flutter_kurkle_color_port
  - apps/chartjs_gallery
  - apps/chart_benchmark_lab
  - apps/chartjs_docs

dev_dependencies:
  commitlint_cli: ^0.8.1
  melos: ^8.9.0
  very_good_analysis: ^11.0.0

melos:
  scripts:
    benchmark:macos:
      run: cd apps/chart_benchmark_lab && flutter run --profile -d macos
      stdio: inherit
      description: Run the cross-library chart benchmark in native macOS profile mode.
    benchmark:web:
      run: cd apps/chart_benchmark_lab && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      stdio: inherit
      description: Preview the cross-library chart benchmark in Chrome.
    benchmark:build:web:
      run: cd apps/chart_benchmark_lab && flutter build web --wasm
      description: Build the chart benchmark for web with a JavaScript fallback.
    docs:
      run: cd apps/chartjs_docs && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      stdio: inherit
      description: Run the documentation site in Chrome.
    docs:build:web:
      run: cd apps/chartjs_docs && flutter build web --wasm
      description: Build the documentation site for the web (WebAssembly with a JavaScript fallback).
    format:
      run: dart format .
      description: Format all Dart code.
    format:check:
      run: dart format --output=none --set-exit-if-changed .
      description: Fail if any Dart file is not formatted.
    analyze:
      run: dart analyze --fatal-infos
      description: Analyze the whole workspace.
    test:
      description: Run the tests of every package that has a test/ directory, without the fixture smoke tests (the tag fixtures, Chart.js ADR 0029) and the theme goldens (the tag golden, Chart.js ADR 0050). Options go after "--" and go to each flutter test call, for example "dart run melos run test --no-select -- --experimental-faster-testing --total-shards=3 --shard-index=0" (one compiled test app for each package, and the first of three shards, as in CI).
      exec:
        command: flutter test --exclude-tags fixtures,golden
        concurrency: 2
        failFast: true
      packageFilters:
        dirExists: test
    test:web:
      run: dart run packages/flutter_chartjs_port/tool/test_web.dart
      description: Run the flutter_chartjs_port, chartjs_test_utils and flutter_kurkle_color_port tests that are not @TestOn('vm') through Flutter in Chrome, with JavaScript and WebAssembly.
    test:goldens:
      run: cd packages/flutter_chartjs_port && flutter test --tags golden test/port/theme/goldens_test.dart
      description: Run the theme goldens of flutter_chartjs_port (Chart.js ADR 0050). They skip unless CHART_GOLDENS=1. Only the CI job fixtures on ubuntu-24.04 sets it. Options go after "--", for example "dart run melos run test:goldens -- --update-goldens" (write the golden files; only the workflow_dispatch run of CI with update_goldens does this).

    # The per-module tools of packages/flutter_chartjs_port/doc/porting-flow.md section 4.
    # Tools 1-3 also examine the add-on ports flutter_chartjs_plugin_zoom_port and flutter_chartjs_chart_sankey_port (ADR 0009 item 6).
    check:lib-imports:
      run: dart run packages/flutter_chartjs_port/tool/check_lib_imports.dart packages/flutter_chartjs_port packages/flutter_chartjs_plugin_zoom_port packages/flutter_chartjs_chart_sankey_port
      description: Fail on flutter_chartjs_port imports outside the allowlists (lib/, pure layers, web tests, theme), on chartjs_test_utils pure.dart imports outside the pure layer, and on flutter_chartjs_plugin_zoom_port and flutter_chartjs_chart_sankey_port imports of flutter_chartjs_port/src/ or chartjs_test_utils/src/ (ADR 0009).
    check:headers:
      run: dart run packages/flutter_chartjs_port/tool/check_port_headers.dart && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_chartjs_plugin_zoom_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_chartjs_chart_sankey_port && dart run packages/flutter_chartjs_port/tool/check_port_headers.dart packages/flutter_kurkle_color_port
      description: Fail on flutter_chartjs_port, chartjs_test_utils, flutter_chartjs_plugin_zoom_port, flutter_chartjs_chart_sankey_port and flutter_kurkle_color_port file headers, DIVERGES markers or port_sources.yaml entries that break the rules. Each add-on package and the color package run as their own home package.
    check:js-semantics:
      run: dart run packages/flutter_chartjs_port/tool/check_js_semantics.dart packages/flutter_chartjs_port packages/flutter_chartjs_plugin_zoom_port packages/flutter_chartjs_chart_sankey_port
      description: Fail on Dart constructs with JavaScript-incompatible results in ported flutter_chartjs_port, chartjs_test_utils, flutter_chartjs_plugin_zoom_port and flutter_chartjs_chart_sankey_port files.
    port:next:check:
      run: dart run packages/flutter_chartjs_port/tool/port_order.dart --check
      description: Fail when tool 8 cannot read a module of third_party/Chart.js/src, a header line of lib/ or a parity.md status, or when an import does not resolve.
    options:gen:
      run: dart run packages/flutter_chartjs_port/tool/options_gen.dart
      description: Write the typed option scopes of flutter_chartjs_port (lib/src/options/*.g.dart) from tool/options_schema.yaml, formatted (Chart.js ADR 0054).
    options:gen:check:
      run: dart run packages/flutter_chartjs_port/tool/options_gen.dart --check
      description: Fail when a generated file of flutter_chartjs_port lib/src/options/ differs from the output of tool/options_schema.yaml, or when that folder has a .g.dart file that the generator does not write.
    check:typed-reads:
      run: dart run packages/flutter_chartjs_port/tool/check_typed_reads.dart
      description: Fail when a count of the by-name forms (jsGet, jsGetKey, string index, jsCall, jsObjectKeys, extends MapBase, with MapMixin, implements Map) in a flutter_chartjs_port lib/src file outside lib/src/js/ and lib/src/options/ is above its baseline in tool/typed_reads/, or when a baseline is stale, and on a class of lib/src outside lib/src/js/ with a Map supertype, the structural rule (tool 9). Options go after "--", for example "dart run melos run check:typed-reads -- --update" (write the baselines from the current tree).
    check:port:
      steps:
        - check:lib-imports
        - check:headers
        - check:js-semantics
        - port:next:check
        - parity:check
        - check:typed-reads
        - options:gen:check
      description: Run check:lib-imports, check:headers, check:js-semantics, port:next:check, parity:check, check:typed-reads and options:gen:check.
    test:fixtures:
      run: dart run packages/flutter_chartjs_port/tool/spec_cases.dart --fixtures
      description: Run the fixture smoke tests of flutter_chartjs_port (tool 7) and report each fixture as passed, failed, skipped or missing. Fail on a failed, missing or unknown fixture and on a bad skip reason. Without the submodule third_party/Chart.js, each fixture skips; with FIXTURES_REQUIRED=1, it fails.
    test:fixtures:zoom:
      run: cd packages/flutter_chartjs_plugin_zoom_port && flutter test --tags fixtures test/specs/fixtures_test.dart
      description: Run the 12 upstream fixtures of flutter_chartjs_plugin_zoom_port (the tag fixtures, seam H24) and compare their scale ranges at the snapshot points with test/fixtures/fixtures_reference.dart. Without the submodule third_party/chartjs-plugin-zoom, each fixture skips; with FIXTURES_REQUIRED=1, it fails.
    test:fixtures:sankey:
      run: cd packages/flutter_chartjs_chart_sankey_port && flutter test --tags fixtures test/specs/fixtures_test.dart
      description: Run the 44 upstream fixtures of flutter_chartjs_chart_sankey_port (the tag fixtures) and compare their observations (the nodes, the flows and the draw calls) with test/fixtures/fixtures_reference.dart. Without the submodule third_party/chartjs-chart-sankey, each fixture skips; with FIXTURES_REQUIRED=1, it fails.
    test:zoom:range-only:
      run: cd packages/flutter_chartjs_plugin_zoom_port && flutter test --dart-define=ZOOM_RANGE_ONLY_UPDATES=true
      description: Run the tests of flutter_chartjs_plugin_zoom_port, the fixtures among them, with the zoom option rangeOnlyUpdates true in Chart.defaults.plugins.zoom, so each zoom and pan takes chart.updateRanges (Chart.js ADR 0111). The results are those of the run without it.
    test:cases:
      run: dart run packages/flutter_chartjs_port/tool/spec_cases.dart
      description: Run the flutter_chartjs_port spec tests and report each upstream case as passed, failed, skipped or missing (tool 5). Fail on unknown test names and on missing cases of ported modules.
    port:next:
      run: dart run packages/flutter_chartjs_port/tool/port_order.dart
      description: List the Chart.js modules that are ready to port, with their line counts and the interfaces that they need, and the blocked modules with their missing imports, in phase order (tool 8). Needs the submodule (melos run upstream). Options go after "--", for example "dart run melos run port:next -- --check" (fail when a module, a header or a parity.md status does not parse) or "-- --json".
    parity:
      run: dart run packages/flutter_chartjs_port/tool/parity.dart
      description: Write packages/flutter_chartjs_port/doc/parity.md from doc/status.yaml, the pinned upstream files, the Dart headers, the spec case results of tool 5 and doc/differences.md (tool 6). It runs the spec tests and needs the submodules (melos run upstream). Options go after "--", for example "dart run melos run parity -- --dry-run" (print the output) or "-- --import" (read the cells of parity.md into status.yaml).
    parity:check:
      run: dart run packages/flutter_chartjs_port/tool/parity.dart --check
      description: Fail when packages/flutter_chartjs_port/doc/parity.md differs from the output of tool 6, or when doc/status.yaml has an error.

    upstream:
      run: git submodule update --init --depth 1
      description: Check out every pinned third_party/ submodule (Chart.js, @kurkle/color, chartjs-test-utils, d3 and the 33 other D3 repositories, Apache ECharts, zrender, chartjs-plugin-zoom and chartjs-chart-sankey). Reference for porting, not shipped.
    upstream:check:
      run: bash tool/check_upstream_pin.sh
      description: Fail unless third_party/Chart.js is pinned to the release tag named by chartJsVersion (for a commit pin <last version>+<sha8>, to a commit that starts with <sha8>), third_party/d3 to the release tag named by d3Version, each other D3 submodule to the commit of its tag in packages/flutter_d3_port/tool/port_sources.yaml, third_party/echarts and third_party/zrender to the release tags named by echartsVersion and zrenderVersion, third_party/chartjs-plugin-zoom to the commit of chartjsPluginZoomVersion (a commit pin <last version>+<sha8>, after the tag v<last version>), and third_party/chartjs-chart-sankey to the release tag named by chartjsChartSankeyVersion.
    upstream:manifest:
      run: cd packages/flutter_chartjs_port && node tool/upstream_manifest/upstream_manifest.mjs --src ../../third_party/Chart.js --out doc/upstream/manifest.json
      description: Write packages/flutter_chartjs_port/doc/upstream/manifest.json and fixtures.json from third_party/Chart.js (tool 4). Needs Node.js 22.18 or later (CI uses 24.12.0) and the submodule (melos run upstream).

    gallery:
      run: cd apps/chartjs_gallery && flutter run -d chrome --web-browser-flag=--enable-blink-features=ExtendedTextMetrics
      # A real terminal, so flutter run's hot reload/restart/quit keys work.
      stdio: inherit
      description: Run the Chart.js gallery in Chrome.
    gallery:macos:
      run: cd apps/chartjs_gallery && flutter run -d macos
      stdio: inherit
      description: Run the Chart.js gallery as a macOS app.
    gallery:device:
      run: cd apps/chartjs_gallery && flutter run
      stdio: inherit
      description: Run the Chart.js gallery on a connected Android/iOS device, emulator or simulator (flutter asks when there are several).
    gallery:build:web:
      run: cd apps/chartjs_gallery && flutter build web --wasm
      description: Build the gallery for the web (WebAssembly with a JavaScript fallback).
    gallery:build:android:
      run: cd apps/chartjs_gallery && flutter build apk --debug
      description: Build a debug APK of the gallery.
    gallery:build:ios:
      run: cd apps/chartjs_gallery && flutter build ios --debug --no-codesign
      description: Build the gallery for iOS without code signing.

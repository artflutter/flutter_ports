name: chartjs_supabase_dashboard
description: A live dashboard sample of flutter_chartjs_port on Supabase.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The pan and the zoom of the time axis: the port of chartjs-plugin-zoom.
  flutter_chartjs_plugin_zoom_port:
    path: ../../packages/flutter_chartjs_plugin_zoom_port
  flutter_chartjs_port:
    path: ../../packages/flutter_chartjs_port
  material_ui: ^1.10.0
  # The pre-release of version 3: the typed queries of the generated schema
  # (lib/supabase_schema.g.dart). A pre-release can break its API, so the
  # version is exact.
  supabase_flutter: 3.0.0-dev.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  # The generator of lib/supabase_schema.g.dart: the Supabase CLI runs it
  # (README.md, "The typed schema").
  supabase_typegen: 0.9.0

flutter:
  uses-material-design: true

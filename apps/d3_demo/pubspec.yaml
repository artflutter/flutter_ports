name: d3_demo
description: >-
  Interactive showcase of flutter_d3_color_port, flutter_d3_interpolate_port,
  flutter_d3_scale_chromatic_port, flutter_d3_path_port, flutter_d3_shape_port,
  flutter_d3_format_port, flutter_d3_array_port, flutter_d3_contour_port,
  flutter_d3_quadtree_port, flutter_d3_hierarchy_port and
  flutter_d3_chord_port.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_d3_array_port: ^0.1.0
  flutter_d3_chord_port: ^0.1.0
  flutter_d3_color_port: ^0.3.0
  flutter_d3_contour_port: ^0.1.0
  flutter_d3_format_port: ^0.1.0
  flutter_d3_hierarchy_port: ^0.1.0
  flutter_d3_interpolate_port: ^0.3.0
  flutter_d3_path_port: ^0.1.0
  flutter_d3_quadtree_port: ^0.1.0
  flutter_d3_scale_chromatic_port: ^0.3.0
  flutter_d3_shape_port: ^0.1.0
  material_ui: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

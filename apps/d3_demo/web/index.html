<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Interactive showcase of the native Dart and Flutter D3 module ports.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4fa">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="D3 for Flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>D3 for Flutter</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f4fa; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #5b5870;
    }
    #splash strong { color: #1b1730; font-size: 18px; font-weight: 600; }
    #splash i {
      width: 28px; height: 28px; border-radius: 50%; box-sizing: border-box;
      border: 3px solid #dfdcf0; border-top-color: #6d28d9;
      animation: splash-turn .9s linear infinite; will-change: transform;
    }
    #splash small { min-height: 1.4em; }
    @keyframes splash-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status">
    <i></i>
    <strong>D3 for Flutter</strong>
    <small id="splash-hint"></small>
  </div>
  <script>
    addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
    setTimeout(() => {
      const hint = document.getElementById('splash-hint');
      if (hint) hint.textContent = 'Still loading. Reload the page if this stays.';
    }, 30000);
  </script>
  <script src="isolate.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

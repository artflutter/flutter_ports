name: chartjs_gallery
description: Gallery and visual test bed for the flutter_chartjs_port port.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # A path dependency: a release of the port does not change this file
  # (Chart.js ADR 0047).
  flutter_chartjs_port:
    path: ../../packages/flutter_chartjs_port

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

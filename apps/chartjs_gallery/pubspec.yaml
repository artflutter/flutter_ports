name: chartjs_gallery
description: Gallery and visual test bed for the flutter_chartjs_port port.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  # The benchmark reads the clock of the chart animations, clock.now()
  # (Chart.js ADR 0143).
  clock: ^1.1.2
  flutter:
    sdk: flutter
  # The chartjs-chart-sankey port, an add-on of the Chart.js port (ADR
  # 0009): the page "Sankey". A path dependency: the package has no release
  # (Sankey ADR 0001).
  flutter_chartjs_chart_sankey_port:
    path: ../../packages/flutter_chartjs_chart_sankey_port
  # The chartjs-plugin-zoom port, an add-on of the Chart.js port (ADR 0009):
  # the page "Zoom and pan" and the global registration of the plugin. A path
  # dependency: the package has no release (Zoom ADR 0001).
  flutter_chartjs_plugin_zoom_port:
    path: ../../packages/flutter_chartjs_plugin_zoom_port
  # A path dependency: a release of the port does not change this file
  # (Chart.js ADR 0047).
  flutter_chartjs_port:
    path: ../../packages/flutter_chartjs_port
  material_ui: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/site_drafts/package_stats.json

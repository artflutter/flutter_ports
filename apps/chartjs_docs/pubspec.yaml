name: chartjs_docs
description: The documentation site of flutter_chartjs_port, with live charts.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_chartjs_port:
    path: ../../packages/flutter_chartjs_port
  material_ui: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # The page shows the code of its live charts from this source file.
    - lib/examples/line_examples.dart
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

name: chartjs_docs
description: The documentation site of flutter_chartjs_port, with live charts.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_chartjs_port:
    path: ../../packages/flutter_chartjs_port
  material_ui: ^1.10.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # The pages show the code of their live charts from these source files.
    - lib/examples/
    - lib/migrate/fl_chart/
    - lib/migrate/graphic/
    - lib/migrate/syncfusion/
    # The data of the fl_chart samples 12 and 13 (fl_chart example app, MIT).
    - assets/flchart/
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf

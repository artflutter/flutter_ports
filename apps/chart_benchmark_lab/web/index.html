<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Compare Flutter chart libraries in your browser: the same chart and data on the Chart.js port, fl_chart, Graphic and Syncfusion, with frame times and a ranking.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fa">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chart benchmark lab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Chart benchmark lab</title>
  <link rel="manifest" href="manifest.json">
  <!-- The engine and the text font come from these hosts. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    The engine reads these files before the first frame, but only after its two
    WebAssembly modules are ready. A preload fetches them in parallel with the
    modules. The engine fetches each one with a plain fetch(), so each link has
    as="fetch" and crossorigin. Roboto is the fallback font of the engine (the
    file name comes from the engine): if a new engine names another file, this
    link loads a file that no code reads, and the engine fetches its own.
  -->
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="https://fonts.gstatic.com/s/roboto/v32/KFOmCnqEu92Fr1Me4GZLCzYlKw.woff2" as="fetch" crossorigin>
  <style>
    /* The color of the page, so that a load and a growing window show no white. */
    html, body { margin: 0; height: 100%; background: #f4f6fa; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #64748b;
    }
    #splash strong { color: #17243b; font-size: 18px; font-weight: 600; }
    /* Only a transform, so that it turns while the main thread compiles the app. */
    #splash i {
      width: 28px; height: 28px; border-radius: 50%; box-sizing: border-box;
      border: 3px solid #dfe5ef; border-top-color: #4f46e5;
      animation: splash-turn .9s linear infinite; will-change: transform;
    }
    #splash small { min-height: 1.4em; }
    @keyframes splash-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #splash i { animation: none; } }
  </style>
</head>
<body>
  <!-- The first paint. The first frame of the app removes it. -->
  <div id="splash" role="status">
    <i></i>
    <strong>Chart benchmark lab</strong>
    <small id="splash-hint"></small>
  </div>
  <script>
    addEventListener('flutter-first-frame', () => document.getElementById('splash')?.remove());
    // A failed load can reject nothing, so a timer is the only sign of it.
    setTimeout(() => {
      const hint = document.getElementById('splash-hint');
      if (hint) hint.textContent = 'Still loading. Reload the page if this stays.';
    }, 30000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="isolate.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: chart_benchmark_lab
description: A shared test bed for comparing Flutter chart libraries.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  cupertino_icons: 1.0.8
  fl_chart: 1.3.0
  flutter:
    sdk: flutter
  # The zoom and pan of the Chart.js port: the port of chartjs-plugin-zoom.
  flutter_chartjs_plugin_zoom_port:
    path: ../../packages/flutter_chartjs_plugin_zoom_port
  flutter_chartjs_port:
    path: ../../packages/flutter_chartjs_port
  graphic: 2.7.0
  material_ui: ^1.10.0
  syncfusion_flutter_charts: 35.1.43

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
